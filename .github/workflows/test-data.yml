name: Test data

# Fills the portal with realistic but clearly fake families, pupils and staff
# for the trial period, or removes all of it. See scripts/test-data.mjs.
#
# Actions → "Test data" → Run workflow:
#   action: generate (default) or remove
#   families / staff: how many to make (generate re-creates from scratch)
#   password: one password shared by every test account (12+ characters)
#
# Test accounts use the reserved .test email domain and test classes are
# excluded from absence and no-show alerts, so nothing is ever emailed.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "generate or remove"
        type: choice
        options: [generate, remove]
        default: generate
      families:
        description: "How many test families (1-150)"
        default: "24"
      staff:
        description: "How many test teachers (1-30)"
        default: "6"
      password:
        description: "Password for every test account, 12+ characters (generate only)"
        required: false

concurrency:
  group: test-data
  cancel-in-progress: false

# Least privilege (security audit T20): this workflow only reads the repo.
permissions:
  contents: read

jobs:
  test-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Mask the password
        if: inputs.password != ''
        run: echo "::add-mask::${{ inputs.password }}"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.122.1

      - name: Find the project ref
        id: project
        run: |
          set -euo pipefail
          PROJECTS=$(supabase projects list -o json)
          REF=$(echo "$PROJECTS" | jq -r ".[] | select(.name==\"secondary-tarbiyyah2's Project\") | .id" | head -n1)
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            COUNT=$(echo "$PROJECTS" | jq 'length')
            if [ "$COUNT" = "1" ]; then REF=$(echo "$PROJECTS" | jq -r '.[0].id'); fi
          fi
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            echo "::error::Could not find the Supabase project."
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Fetch service role key
        id: keys
        run: |
          set -euo pipefail
          KEYS=$(supabase projects api-keys --project-ref "${{ steps.project.outputs.ref }}" -o json)
          SERVICE_ROLE=$(echo "$KEYS" | jq -r '.[] | select(.name=="service_role" or .name=="secret") | .api_key' | head -n1)
          if [ -z "$SERVICE_ROLE" ] || [ "$SERVICE_ROLE" = "null" ]; then
            echo "::error::Could not find a service_role/secret key."
            exit 1
          fi
          echo "::add-mask::$SERVICE_ROLE"
          echo "service_role_key=$SERVICE_ROLE" >> "$GITHUB_OUTPUT"

      - name: ${{ inputs.action == 'remove' && 'Remove test data' || 'Generate test data' }}
        env:
          SUPABASE_URL: https://${{ steps.project.outputs.ref }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.keys.outputs.service_role_key }}
          TEST_FAMILIES: ${{ inputs.families }}
          TEST_STAFF: ${{ inputs.staff }}
          TEST_PASSWORD: ${{ inputs.password }}
        run: |
          set -euo pipefail
          npm ci
          node scripts/test-data.mjs "${{ inputs.action }}" 2>&1 | tee /tmp/out.txt || { echo "::error title=Test data failed::$(tail -1 /tmp/out.txt)"; exit 1; }
          echo "::notice title=Test data::$(tail -2 /tmp/out.txt | tr '\n' ' ')"
