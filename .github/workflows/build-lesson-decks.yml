name: Build lesson decks

# Turns content/lessons/**/*.json into branded PowerPoint decks (with the TGA
# logo) plus a PDF copy of each, and a teacher lesson plan (Word + PDF), and loads them into the portal's Lesson
# library (storage bucket lesson-decks + table curriculum_lessons, migration
# 0091). Decks a teacher uploaded themselves are never overwritten. A lesson
# whose content changed (edited in the portal's lesson editor, then copied
# into content/lessons by "Sync curriculum from the portal", or edited in the
# repo) gets new slides and a new plan as a new version (migration 0179).
# Runs when lesson content or the generator changes, or on demand (the sync
# workflow starts it after copying portal edits in).
#
# Lessons v3: before building, each lesson's pictures[] are looked up on Wikimedia
# Commons (scripts/lessons/pictures.mjs: open licences only, never people); the
# choices are saved back to content/lesson-pictures.json at the end so builds are
# repeatable. If Commons cannot be reached the slides are built without pictures.
# Each lesson also gets a pupil PDF (slides pupils need + a worksheet), converted
# and uploaded with the plan (migration 0189).

on:
  push:
    branches: [main]
    paths:
      - "content/lessons/**"
      - "content/lesson-pictures.json"
      - "scripts/lessons/**"
      - "src/lib/learn/lessonSchema.mjs"
      - ".github/workflows/build-lesson-decks.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-upload generated decks that already exist (never overwrites teacher-edited ones)"
        required: false
        default: "false"

concurrency:
  group: build-lesson-decks
  cancel-in-progress: false

# Least privilege (security audit T20): the only write is saving the picture choices
# (content/lesson-pictures.json, the last step).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # A full rebuild (design change) converts every deck, lesson plan and pupil PDF (about
    # 4,500 files since lessons v3): allow for it.
    timeout-minutes: 300
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # When the deck design itself changes (build-decks.mjs), every generated
      # deck already in the portal is refreshed so all lessons get the new
      # look. Decks a teacher uploaded (custom_deck) are still never touched.
      - name: Refresh existing decks if the design changed
        id: refresh
        run: |
          FORCE=0
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE=1; fi
          if [ "${{ github.event_name }}" = "push" ] && git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qxE "scripts/lessons/(build-decks|deck-parts|deck-v3|lesson-plan|arabic).mjs|src/lib/learn/lessonSchema.mjs"; then
            echo "Deck design changed: refreshing all generated decks."
            FORCE=1
          fi
          echo "force=$FORCE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate lesson content
        run: node scripts/lessons/validate.mjs

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save pptxgenjs@4.0.1 docx@9.5.1

      # Pictures (lessons v3): downloaded images are cached between runs; the choices are in the repo.
      - name: Cache downloaded lesson pictures
        uses: actions/cache@v4
        with:
          path: .cache/lesson-pictures
          key: lesson-pictures-${{ hashFiles('content/lesson-pictures.json') }}
          restore-keys: lesson-pictures-

      - name: Find pictures on Wikimedia Commons
        continue-on-error: true # never block the build: slides are built without pictures instead
        timeout-minutes: 20
        run: node scripts/lessons/pictures.mjs resolve

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: latest

      - name: Find the project ref and service-role key
        id: keys
        run: |
          set -euo pipefail
          PROJECTS=$(supabase projects list -o json)
          REF=$(echo "$PROJECTS" | jq -r ".[] | select(.name==\"secondary-tarbiyyah2's Project\") | .id" | head -n1)
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            COUNT=$(echo "$PROJECTS" | jq 'length')
            if [ "$COUNT" = "1" ]; then REF=$(echo "$PROJECTS" | jq -r '.[0].id'); fi
          fi
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            echo "::error::Could not find the Supabase project."
            exit 1
          fi
          SERVICE_ROLE=$(supabase projects api-keys --project-ref "$REF" -o json | jq -r '.[] | select(.name=="service_role" or .name=="secret") | .api_key' | head -n1)
          if [ -z "$SERVICE_ROLE" ] || [ "$SERVICE_ROLE" = "null" ]; then
            echo "::error::Could not find a service_role/secret key."
            exit 1
          fi
          echo "::add-mask::$SERVICE_ROLE"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "service_role_key=$SERVICE_ROLE" >> "$GITHUB_OUTPUT"

      - name: Build PowerPoint decks
        run: node scripts/lessons/build-decks.mjs out/decks

      - name: Work out which decks still need uploading
        env:
          SUPABASE_URL: https://${{ steps.keys.outputs.ref }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.keys.outputs.service_role_key }}
          FORCE: ${{ steps.refresh.outputs.force }}
        run: node scripts/lessons/upload-decks.mjs plan out/decks

      - name: Install LibreOffice (for PDF copies)
        run: |
          if ! command -v soffice >/dev/null; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends libreoffice-impress fonts-liberation fonts-crosextra-carlito fonts-dejavu-core fonts-noto-core fonts-noto-naskh-arabic || sudo apt-get install -y libreoffice
          fi

      - name: Convert needed decks to PDF
        run: |
          set -euo pipefail
          cd out/decks
          node -e 'const n=require("./needed.json");require("fs").writeFileSync("needed.txt",n.join("\n"))'
          if [ ! -s needed.txt ]; then echo "Nothing to convert"; exit 0; fi
          # Four LibreOffice instances in parallel, each with its own profile.
          split -n l/4 -d needed.txt chunk_
          for c in chunk_*; do
            (
              while IFS= read -r f; do
                dir=$(dirname "$f")
                soffice -env:UserInstallation=file:///tmp/lo_$c --headless --convert-to pdf --outdir "$dir" "$f" >/dev/null 2>&1 || echo "::warning::PDF failed for $f"
              done < "$c"
            ) &
          done
          wait
          echo "PDFs: $(find . -name '*.pdf' | wc -l)"

      - name: Upload decks to the portal
        env:
          SUPABASE_URL: https://${{ steps.keys.outputs.ref }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.keys.outputs.service_role_key }}
          FORCE: ${{ steps.refresh.outputs.force }}
        run: node scripts/lessons/upload-decks.mjs upload out/decks

      - name: Save the picture choices
        if: always()
        run: bash scripts/lessons/commit-pictures.sh
