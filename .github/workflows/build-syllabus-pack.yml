name: Build syllabus pack

# Turns content/syllabus/**.json (kept in step with the portal's Curriculum planner)
# into the syllabus pack: a whole-school curriculum overview and one curriculum
# document per subject (PDF via Chromium, plus an editable Word copy), and the
# cross-curricular matrix deck. Uploads it to the portal's storage bucket
# lesson-decks under syllabus-pack/ (staff-only, same RLS as the lesson library).
# The same pack is attached to the run as a downloadable artifact.

on:
  push:
    branches: [main]
    paths:
      - "content/syllabus/**"
      - "scripts/syllabus/**"
      - "scripts/lessons/deck-parts.mjs"
      - ".github/workflows/build-syllabus-pack.yml"
  workflow_dispatch:

concurrency:
  group: build-syllabus-pack
  cancel-in-progress: false

# Least privilege (security audit T20): this workflow only reads the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate syllabus data
        run: node scripts/syllabus/validate.mjs

      # The pack's own tools are not site dependencies, so they are installed here (in ONE
      # command: a second `npm install --no-save` would remove the first one's packages).
      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save --no-audit --no-fund pptxgenjs@4.0.1 docx@9.5.1 pdf-lib@1.17.1 playwright@1.63.0 @fontsource-variable/inter@5.3.0 @fontsource-variable/source-serif-4@5.3.1 @fontsource/amiri@5.3.0
          npx playwright install --with-deps chromium

      - name: Install LibreOffice (matrix deck PDF) and pdftotext (contents page numbers)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends poppler-utils
          if ! command -v soffice >/dev/null; then
            sudo apt-get install -y --no-install-recommends libreoffice-impress fonts-liberation fonts-crosextra-carlito fonts-noto-core || sudo apt-get install -y libreoffice fonts-noto-core
          fi

      - name: Build the pack (PDF, Word and the matrix deck)
        run: node scripts/syllabus/build.mjs --out dist/syllabus-pack --pdf

      - uses: actions/upload-artifact@v4
        with:
          name: TGA_Syllabus_Pack
          path: dist/syllabus-pack
          retention-days: 30

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: latest

      - name: Upload to the portal
        run: |
          set -euo pipefail
          PROJECTS=$(supabase projects list -o json)
          REF=$(echo "$PROJECTS" | jq -r ".[] | select(.name==\"secondary-tarbiyyah2's Project\") | .id" | head -n1)
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            if [ "$(echo "$PROJECTS" | jq 'length')" = "1" ]; then REF=$(echo "$PROJECTS" | jq -r '.[0].id'); fi
          fi
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then echo "::error::Could not find the Supabase project."; exit 1; fi
          KEY=$(supabase projects api-keys --project-ref "$REF" -o json | jq -r '.[] | select(.name=="service_role" or .name=="secret") | .api_key' | head -n1)
          if [ -z "$KEY" ] || [ "$KEY" = "null" ]; then echo "::error::Could not find a service_role/secret key."; exit 1; fi
          echo "::add-mask::$KEY"
          SUPABASE_URL="https://$REF.supabase.co" SUPABASE_SERVICE_ROLE_KEY="$KEY" node scripts/syllabus/upload.mjs dist/syllabus-pack
