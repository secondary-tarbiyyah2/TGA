name: Build revision booklets

# One branded revision booklet (PDF) per unit, built from content/lessons and
# loaded into the lesson-decks bucket under revision-booklets/.

on:
  push:
    branches: [main]
    paths:
      - "content/lessons/**"
      - "scripts/revision/**"
      - "src/lib/learn/lessonSchema.mjs"
      - ".github/workflows/build-revision-booklets.yml"
  workflow_dispatch:

concurrency:
  group: build-revision-booklets
  cancel-in-progress: false

# Least privilege (security audit T20): this workflow only reads the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Validate lesson content
        run: node scripts/lessons/validate.mjs

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save pptxgenjs@4.0.1 docx@9.5.1

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.122.1

      - name: Find the project ref and service-role key
        id: keys
        run: |
          set -euo pipefail
          PROJECTS=$(supabase projects list -o json)
          REF=$(echo "$PROJECTS" | jq -r ".[] | select(.name==\"secondary-tarbiyyah2's Project\") | .id" | head -n1)
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            COUNT=$(echo "$PROJECTS" | jq 'length')
            if [ "$COUNT" = "1" ]; then REF=$(echo "$PROJECTS" | jq -r '.[0].id'); fi
          fi
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            echo "::error::Could not find the Supabase project."
            exit 1
          fi
          SERVICE_ROLE=$(supabase projects api-keys --project-ref "$REF" -o json | jq -r '.[] | select(.name=="service_role" or .name=="secret") | .api_key' | head -n1)
          if [ -z "$SERVICE_ROLE" ] || [ "$SERVICE_ROLE" = "null" ]; then
            echo "::error::Could not find a service_role/secret key."
            exit 1
          fi
          echo "::add-mask::$SERVICE_ROLE"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "service_role_key=$SERVICE_ROLE" >> "$GITHUB_OUTPUT"

      - name: Build booklets
        run: node scripts/revision/build-booklets.mjs out/booklets

      - name: Install LibreOffice
        run: |
          if ! command -v soffice >/dev/null; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation fonts-crosextra-carlito fonts-dejavu-core || sudo apt-get install -y libreoffice
          fi

      - name: Convert to PDF
        run: |
          set -euo pipefail
          cd out/booklets
          find . -name '*.docx' > all.txt
          split -n l/4 -d all.txt chunk_
          for c in chunk_*; do
            (
              while IFS= read -r f; do
                soffice -env:UserInstallation=file:///tmp/lo_$c --headless --convert-to pdf --outdir "$(dirname "$f")" "$f" >/dev/null 2>&1 || echo "::warning::PDF failed for $f"
              done < "$c"
            ) &
          done
          wait
          echo "PDFs: $(find . -name '*.pdf' | wc -l)"

      - name: Upload booklets
        env:
          SUPABASE_URL: https://${{ steps.keys.outputs.ref }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.keys.outputs.service_role_key }}
        run: node scripts/revision/upload-booklets.mjs out/booklets
