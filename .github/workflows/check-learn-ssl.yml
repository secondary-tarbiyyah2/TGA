name: Check /learn subdomain SSL certificate

# HISTORICAL: this diagnosed ERR_SSL_VERSION_OR_CIPHER_MISMATCH on the
# portal's OLD address, learn.globalacademy.tarbiyyah.co.uk — confirmed via
# this workflow that Cloudflare's free Universal SSL certificate only covers
# the apex plus ONE level of wildcard (tarbiyyah.co.uk + *.tarbiyyah.co.uk),
# so that second-level hostname got no certificate at all. Fixed by renaming
# the portal to learn.tarbiyyah.co.uk (one level deep, covered by the same
# wildcard for free) — see src/lib/learn/origin.ts and SETUP.md, "Moving
# /learn to its own subdomain". Kept here as a live check that the current
# hostname still gets a valid certificate; do not renest it under
# globalacademy.* again without buying Cloudflare's Advanced Certificate
# Manager add-on to cover it.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch certificate details
        run: |
          set -uo pipefail
          for host in globalacademy.tarbiyyah.co.uk learn.tarbiyyah.co.uk; do
            echo "=================================================="
            echo "Host: $host"
            echo "=================================================="
            echo | openssl s_client -connect "$host:443" -servername "$host" 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName 2>/dev/null || echo "Could not retrieve certificate"
            echo ""
            echo "--- Raw handshake attempt (for error detail) ---"
            echo | openssl s_client -connect "$host:443" -servername "$host" 2>&1 | head -20 || true
            echo ""
          done
