name: Sync revision packs

# Loads Unit revision packs (quiz and practice questions, summary slides, unit
# videos) from content/ into the portal: tables revision_units and
# revision_questions (migration 0094) and storage bucket revision-media.
# Runs when lesson or revision content changes, after the backend deploys
# (so new tables exist first), or on demand.

on:
  push:
    branches: [main]
    paths:
      - "content/lessons/**"
      - "content/revision/**"
      - "scripts/lessons/sync-revision.mjs"
      - ".github/workflows/sync-revision.yml"
  workflow_run:
    workflows: ["Deploy Supabase backend"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-revision
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the packs build
        run: node scripts/lessons/sync-revision.mjs check

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Find the project ref and service-role key
        id: keys
        run: |
          set -euo pipefail
          PROJECTS=$(supabase projects list -o json)
          REF=$(echo "$PROJECTS" | jq -r ".[] | select(.name==\"secondary-tarbiyyah2's Project\") | .id" | head -n1)
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            COUNT=$(echo "$PROJECTS" | jq 'length')
            if [ "$COUNT" = "1" ]; then REF=$(echo "$PROJECTS" | jq -r '.[0].id'); fi
          fi
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            echo "::error::Could not find the Supabase project."
            exit 1
          fi
          SERVICE_ROLE=$(supabase projects api-keys --project-ref "$REF" -o json | jq -r '.[] | select(.name=="service_role" or .name=="secret") | .api_key' | head -n1)
          if [ -z "$SERVICE_ROLE" ] || [ "$SERVICE_ROLE" = "null" ]; then
            echo "::error::Could not find a service_role/secret key."
            exit 1
          fi
          echo "::add-mask::$SERVICE_ROLE"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "service_role_key=$SERVICE_ROLE" >> "$GITHUB_OUTPUT"

      - name: Load the packs into the portal
        env:
          SUPABASE_URL: https://${{ steps.keys.outputs.ref }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.keys.outputs.service_role_key }}
        run: |
          # On a push the backend deploy may still be adding the tables; retry for a few minutes.
          for i in 1 2 3 4 5 6; do
            if node scripts/lessons/sync-revision.mjs sync; then exit 0; fi
            echo "Retrying in 60s…"; sleep 60
          done
          exit 1
