name: Check /learn subdomain DNS

# One-off diagnostic: the user reports DNS_PROBE_FINISHED_NXDOMAIN for
# learn.globalacademy.tarbiyyah.co.uk in their browser, right after a
# successful FTP deploy to that subdomain's document root. FTP works by
# server hostname/IP, not public DNS, so this checks whether the
# subdomain actually has a DNS record at all, and compares it to the
# working main domain's own DNS setup so we know exactly what's missing.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Basic getent lookups
        run: |
          set -uo pipefail
          echo "--- globalacademy.tarbiyyah.co.uk (known working) ---"
          getent hosts globalacademy.tarbiyyah.co.uk || echo "no A record"
          echo ""
          echo "--- learn.globalacademy.tarbiyyah.co.uk ---"
          getent hosts learn.globalacademy.tarbiyyah.co.uk || echo "no A record"

      - name: Detailed DNS records (A/NS/CNAME) via dnspython
        run: |
          pip install --quiet dnspython
          python3 scripts/check-dns.py
