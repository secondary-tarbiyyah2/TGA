name: Generate timetable (OR-Tools solver)

# Runs the CP-SAT solver (scripts/timetable-solver/generate.py) against the
# LIVE Supabase project's constraint data and writes a new draft
# timetable_runs/timetable_slots/timetable_conflicts set back to it. Never
# runs automatically — a Head Teacher/Admin/Timetabler triggers it by hand
# (or later, a DB webhook could call the GitHub API to dispatch this same
# workflow; workflow_dispatch alone is enough for Phase A per the project's
# own decision record).
#
# Same secret (SUPABASE_ACCESS_TOKEN) and same "find the project by name"
# logic as deploy-supabase.yml, so this doesn't need its own copy of the
# project ref stored anywhere.
on:
  workflow_dispatch:
    inputs:
      academic_year_label:
        description: "Exact academic_years.label to generate a timetable for (e.g. \"2026/27\" or \"2099/00 (TEST)\")"
        required: true
      run_label:
        description: "Label for the resulting timetable_runs row (optional — defaults to a generated one)"
        required: false
        default: ""
      solver_max_seconds:
        description: "Solver time budget in seconds"
        required: false
        default: "120"

concurrency:
  group: generate-timetable
  cancel-in-progress: false

# Least privilege (security audit T20): this workflow only reads the repo.
permissions:
  contents: read

jobs:
  solve:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SOLVER_MAX_SECONDS: ${{ inputs.solver_max_seconds }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.122.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - run: pip install ortools supabase

      - name: Find the project ref
        id: project
        run: |
          set -euo pipefail
          PROJECTS=$(supabase projects list -o json)
          REF=$(echo "$PROJECTS" | jq -r ".[] | select(.name==\"secondary-tarbiyyah2's Project\") | .id" | head -n1)
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            COUNT=$(echo "$PROJECTS" | jq 'length')
            if [ "$COUNT" = "1" ]; then
              REF=$(echo "$PROJECTS" | jq -r '.[0].id')
            fi
          fi
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            echo "::error::Could not find the Supabase project. Projects found: $(echo "$PROJECTS" | jq -c '[.[].name]')"
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Fetch service-role key
        id: keys
        run: |
          set -euo pipefail
          KEYS=$(supabase projects api-keys --project-ref "${{ steps.project.outputs.ref }}" -o json)
          SERVICE_ROLE=$(echo "$KEYS" | jq -r '.[] | select(.name=="service_role" or .name=="secret") | .api_key' | head -n1)
          if [ -z "$SERVICE_ROLE" ] || [ "$SERVICE_ROLE" = "null" ]; then
            echo "::error::Could not find a service_role/secret key."
            exit 1
          fi
          echo "::add-mask::$SERVICE_ROLE"
          echo "service_role_key=$SERVICE_ROLE" >> "$GITHUB_OUTPUT"

      - name: Run the solver
        env:
          SUPABASE_URL: https://${{ steps.project.outputs.ref }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.keys.outputs.service_role_key }}
        run: |
          set -euo pipefail
          ARGS=(--academic-year-label "${{ inputs.academic_year_label }}")
          if [ -n "${{ inputs.run_label }}" ]; then
            ARGS+=(--label "${{ inputs.run_label }}")
          fi
          python3 scripts/timetable-solver/generate.py "${ARGS[@]}" | tee /tmp/solver-output.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "## Timetable generation result"
            echo '```'
            cat /tmp/solver-output.txt
            echo '```'
            echo "Review the draft run under /admin/lessons/timetable on the /learn subdomain before publishing it."
          } >> "$GITHUB_STEP_SUMMARY"
