name: Alert on workflow failure

# Emails the school when any scheduled job or deploy fails. GitHub only emails
# the person who last edited a workflow file, so before this a broken reminder,
# retention or deploy run could fail silently for weeks.
#
# Recipient: the OPS_ALERT_EMAIL repository variable, else the admissions
# inbox. Uses the same mail secrets as the other scheduled scripts.

on:
  workflow_run:
    workflows:
      - Check policy review dates
      - Check Single Central Record expiry
      - Compliance retention
      - Deploy site
      - Deploy Supabase backend
      - Absence alerts
      - Lesson recording retention
      - Messaging retention
      - No-show alerts
      - Notify flagged messages
      - Nudge outstanding signatures
      - Open evening reminders
      - Safeguarding review check
      - Sync signable documents from Sanity
      - Teams meetings sync
      - Weekly parent digest
    types: [completed]

jobs:
  alert:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Email the alert
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          OPS_ALERT_EMAIL: ${{ vars.OPS_ALERT_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AWS_SES_REGION: ${{ secrets.AWS_SES_REGION }}
          AWS_SES_ACCESS_KEY_ID: ${{ secrets.AWS_SES_ACCESS_KEY_ID }}
          AWS_SES_SECRET_ACCESS_KEY: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY }}
        run: node scripts/alert-workflow-failure.mjs
