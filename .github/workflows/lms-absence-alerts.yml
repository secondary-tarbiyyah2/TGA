name: Absence alerts

# Hourly: emails parents of any child not yet marked present for a lesson
# whose scheduled end + the configured delay has passed, and escalates
# unexplained absences to the Head Teacher (every run) and the Safeguarding
# Lead (once a child crosses the configured rolling threshold). See
# scripts/lms-absence-alerts.mjs.

on:
  schedule:
    - cron: "0 * * * *" # hourly, on the hour (anchored to creation time by Supabase-style schedulers is N/A here — GitHub cron is literal)
  workflow_dispatch:

concurrency:
  group: lms-absence-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_IO }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      AWS_SES_REGION: ${{ secrets.AWS_SES_REGION }}
      AWS_SES_ACCESS_KEY_ID: ${{ secrets.AWS_SES_ACCESS_KEY_ID }}
      AWS_SES_SECRET_ACCESS_KEY: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Find the project ref
        id: project
        run: |
          set -euo pipefail
          PROJECTS=$(supabase projects list -o json)
          REF=$(echo "$PROJECTS" | jq -r ".[] | select(.name==\"secondary-tarbiyyah2's Project\") | .id" | head -n1)
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            COUNT=$(echo "$PROJECTS" | jq 'length')
            if [ "$COUNT" = "1" ]; then
              REF=$(echo "$PROJECTS" | jq -r '.[0].id')
            fi
          fi
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            echo "::error::Could not find the Supabase project. Projects found: $(echo "$PROJECTS" | jq -c '[.[].name]')"
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Fetch service-role key
        id: keys
        run: |
          set -euo pipefail
          KEYS=$(supabase projects api-keys --project-ref "${{ steps.project.outputs.ref }}" -o json)
          SERVICE_ROLE=$(echo "$KEYS" | jq -r '.[] | select(.name=="service_role" or .name=="secret") | .api_key' | head -n1)
          if [ -z "$SERVICE_ROLE" ] || [ "$SERVICE_ROLE" = "null" ]; then
            echo "::error::Could not find a service_role/secret key."
            exit 1
          fi
          echo "::add-mask::$SERVICE_ROLE"
          echo "service_role_key=$SERVICE_ROLE" >> "$GITHUB_OUTPUT"

      - name: Run absence alert job
        env:
          SUPABASE_URL: https://${{ steps.project.outputs.ref }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.keys.outputs.service_role_key }}
        run: node scripts/lms-absence-alerts.mjs
