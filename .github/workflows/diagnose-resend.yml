name: Diagnose Resend email delivery

# Manually-triggered. Reports (as run annotations) whether the sending domain
# is verified with Resend and what Resend says when a real test email is sent
# from the same address the portal uses. Never prints the API key.

on:
  workflow_dispatch:
    inputs:
      to:
        description: "Address to send the test email to"
        default: "secondary@tarbiyyah.co.uk"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Domain status and test send
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO: ${{ inputs.to }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then echo "::error::RESEND_API_KEY secret is EMPTY"; exit 1; fi
          D=$(curl -sS https://api.resend.com/domains -H "Authorization: Bearer $RESEND_API_KEY")
          echo "::notice title=Resend domains::$(echo "$D" | jq -c '.' | cut -c1-400)"
          R=$(curl -sS -w ' HTTP %{http_code}' https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" \
            -d "{\"from\":\"Tarbiyyah Global Academy <noreply@globalacademy.tarbiyyah.co.uk>\",\"to\":[\"$TO\"],\"subject\":\"TGA email test\",\"html\":\"<p>Test from the Learn portal diagnostics.</p>\"}")
          echo "::notice title=Resend test send::$(echo "$R" | cut -c1-400)"
