name: Diagnose Resend email delivery

# Manually-triggered troubleshooting workflow — checks whether the sending
# domain used for booking/account emails (tarbiyyah.co.uk) is verified with
# Resend. An unverified domain is the most common reason emails silently
# never arrive: Resend accepts the API call (so the app shows "sent") but
# then drops or restricts delivery, and nothing in this repo previously
# surfaced that failure anywhere. Safe to re-run any time email delivery is
# in question.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Resend domain verification status
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          curl -sS https://api.resend.com/domains \
            -H "Authorization: Bearer $RESEND_API_KEY" | jq '.data[] | {name, status, region}'
