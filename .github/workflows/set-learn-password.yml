name: Set /learn account password

# Support tool: sets a temporary password on an EXISTING /learn account, as
# a fallback when the one-time magic-link invite isn't working (e.g. the
# invite/redirect page hanging). /learn/login already supports email+
# password sign-in directly. Deliberately its own workflow (not folded
# into deploy-supabase.yml) so it never waits behind that workflow's
# concurrency group or its test/migration steps — this only touches one
# auth user and should run in seconds.

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email of the existing /learn account to set a password for"
        required: true
      password:
        description: "Optional: the password to set (12+ chars). Leave blank to generate one, shown in this run's summary."
        required: false
        default: ""

jobs:
  set-password:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      # Read the input from the event file, never as ${{ inputs.password }} in
      # the script: GitHub prints a run step's script (with expressions filled
      # in) at the top of its log, so that would show the password in clear.
      - name: Mask chosen password
        run: |
          P=$(jq -r '.inputs.password // ""' "$GITHUB_EVENT_PATH")
          if [ -n "$P" ]; then echo "::add-mask::$P"; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Find the project ref
        id: project
        run: |
          set -euo pipefail
          PROJECTS=$(supabase projects list -o json)
          REF=$(echo "$PROJECTS" | jq -r ".[] | select(.name==\"secondary-tarbiyyah2's Project\") | .id" | head -n1)
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            COUNT=$(echo "$PROJECTS" | jq 'length')
            if [ "$COUNT" = "1" ]; then
              REF=$(echo "$PROJECTS" | jq -r '.[0].id')
            fi
          fi
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            echo "::error::Could not find the Supabase project. Projects found: $(echo "$PROJECTS" | jq -c '[.[].name]')"
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Fetch service role key
        id: keys
        run: |
          set -euo pipefail
          KEYS=$(supabase projects api-keys --project-ref "${{ steps.project.outputs.ref }}" -o json)
          SERVICE_ROLE=$(echo "$KEYS" | jq -r '.[] | select(.name=="service_role" or .name=="secret") | .api_key' | head -n1)
          if [ -z "$SERVICE_ROLE" ] || [ "$SERVICE_ROLE" = "null" ]; then
            echo "::error::Could not find a service_role/secret key. Key names found: $(echo "$KEYS" | jq -c '[.[].name]')"
            exit 1
          fi
          echo "::add-mask::$SERVICE_ROLE"
          echo "service_role_key=$SERVICE_ROLE" >> "$GITHUB_OUTPUT"

      - name: Set password
        env:
          SUPABASE_URL: https://${{ steps.project.outputs.ref }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.keys.outputs.service_role_key }}
          TEMP_PASSWORD: ${{ inputs.password }}
          ACCOUNT_EMAIL: ${{ inputs.email }}
        run: |
          set -euo pipefail
          npm ci
          node scripts/set-learn-account-password.mjs "$ACCOUNT_EMAIL" | tee /tmp/set-password-output.txt
          {
            echo "## Password set"
            echo '```'
            cat /tmp/set-password-output.txt
            echo '```'
            echo "⚠️ The password above is shown only in this log — copy it now. It will not be shown again."
          } >> "$GITHUB_STEP_SUMMARY"
