name: Research competitor site (one-off)

# This sandbox's own egress proxy blocks arbitrary external domains, but a
# GitHub-hosted runner has normal internet access — same reason this
# workflow exists as check-*.yml diagnostics do for the live TGA site
# itself. Fetches a competitor's public pages and extracts readable text
# (via BeautifulSoup) so it can be reviewed for design/content ideas.
# Read-only, no write access to anything — just curl + text extraction.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL of the site to research, e.g. https://example.co.uk"
        required: true
      paths:
        description: "Comma-separated paths to fetch, e.g. /,/admissions,/fees,/curriculum"
        required: false
        default: "/"

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and extract text from each page
        run: |
          set -uo pipefail
          pip install --quiet beautifulsoup4 lxml
          BASE="${{ inputs.base_url }}"
          IFS=',' read -ra PATHS <<< "${{ inputs.paths }}"
          for p in "${PATHS[@]}"; do
            url="${BASE}${p}"
            echo "=================================================="
            echo "URL: $url"
            echo "=================================================="
            curl -sS -L -A "Mozilla/5.0 (research)" "$url" -o /tmp/page.html || { echo "fetch failed"; continue; }
            python3 scripts/extract-page-text.py
            echo ""
          done
