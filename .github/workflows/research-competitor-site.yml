name: Research competitor site (one-off)

# This sandbox's own egress proxy blocks arbitrary external domains, but a
# GitHub-hosted runner has normal internet access — same reason this
# workflow exists as check-*.yml diagnostics do for the live TGA site
# itself. Fetches a competitor's public pages with a real headless browser
# (a plain curl+BeautifulSoup version was tried first, but returned only
# an empty client-rendered shell on the site this was built for) and
# extracts readable text so it can be reviewed for design/content ideas.
# Read-only, no write access to anything.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL of the site to research, e.g. https://example.co.uk"
        required: true
      paths:
        description: "Comma-separated paths to fetch, e.g. /,/admissions,/fees,/curriculum"
        required: false
        default: "/"

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install playwright@1
          npx playwright install --with-deps chromium

      - name: Render each page with a real browser and extract text
        env:
          RESEARCH_BASE_URL: ${{ inputs.base_url }}
          RESEARCH_PATHS: ${{ inputs.paths }}
        run: node scripts/extract-page-text-rendered.mjs
