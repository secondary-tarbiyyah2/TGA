name: Seed demo portal accounts

# Creates/resets three demo /learn logins (teacher, parent, student) and a
# small fake world (two "Demo:" classes, timetable, lessons, homework,
# grades, announcements) for walking through the portal. See
# scripts/seed-demo-accounts.mjs. Re-running wipes and rebuilds the demo
# data and sets the passwords given here. Demo accounts only ever see demo
# data: RLS scopes them to their own demo class/child.

on:
  workflow_dispatch:
    inputs:
      teacher_password:
        description: "Password for demo-teacher@tarbiyyah.co.uk (12+ chars)"
        required: true
      parent_password:
        description: "Password for demo-parent@tarbiyyah.co.uk (12+ chars)"
        required: true
      student_password:
        description: "Password for demo-student@tarbiyyah.co.uk (12+ chars)"
        required: true

# Least privilege (security audit T20): this workflow only reads the repo.
permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      # Read the inputs from the event file, never as ${{ inputs.* }} in the
      # script: GitHub prints a run step's script (with expressions filled in)
      # at the top of its log, so that would show the passwords in clear.
      - name: Mask passwords
        run: |
          for k in teacher_password parent_password student_password; do
            P=$(jq -r --arg k "$k" '.inputs[$k] // ""' "$GITHUB_EVENT_PATH")
            if [ -n "$P" ]; then echo "::add-mask::$P"; fi
          done

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.122.1

      - name: Find the project ref
        id: project
        run: |
          set -euo pipefail
          PROJECTS=$(supabase projects list -o json)
          REF=$(echo "$PROJECTS" | jq -r ".[] | select(.name==\"secondary-tarbiyyah2's Project\") | .id" | head -n1)
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            COUNT=$(echo "$PROJECTS" | jq 'length')
            if [ "$COUNT" = "1" ]; then REF=$(echo "$PROJECTS" | jq -r '.[0].id'); fi
          fi
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            echo "::error::Could not find the Supabase project."
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Fetch service role key
        id: keys
        run: |
          set -euo pipefail
          KEYS=$(supabase projects api-keys --project-ref "${{ steps.project.outputs.ref }}" -o json)
          SERVICE_ROLE=$(echo "$KEYS" | jq -r '.[] | select(.name=="service_role" or .name=="secret") | .api_key' | head -n1)
          if [ -z "$SERVICE_ROLE" ] || [ "$SERVICE_ROLE" = "null" ]; then
            echo "::error::Could not find a service_role/secret key."
            exit 1
          fi
          echo "::add-mask::$SERVICE_ROLE"
          echo "service_role_key=$SERVICE_ROLE" >> "$GITHUB_OUTPUT"

      - name: Seed demo accounts
        env:
          SUPABASE_URL: https://${{ steps.project.outputs.ref }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.keys.outputs.service_role_key }}
          DEMO_TEACHER_PASSWORD: ${{ inputs.teacher_password }}
          DEMO_PARENT_PASSWORD: ${{ inputs.parent_password }}
          DEMO_STUDENT_PASSWORD: ${{ inputs.student_password }}
        run: |
          set -euo pipefail
          npm ci
          node scripts/seed-demo-accounts.mjs 2>&1 | tee /tmp/out.txt || { echo "::error::$(tail -1 /tmp/out.txt)"; exit 1; }
          echo "::notice title=Demo accounts ready::$(tail -2 /tmp/out.txt | tr '\n' ' ')"
