name: Message digest

# Once a day (16:05 UTC, after school in the UK): calls the message-email
# Edge Function, which sends one summary email to each person who chose
# "Once a day" for message emails (Account, Messages) and has unread
# messages. People on "As they arrive" are emailed when a message is sent, by
# the portal itself, so this needs no frequent schedule (one run a day keeps
# inside GitHub's free Actions minutes).

on:
  schedule:
    - cron: "5 16 * * *"
  workflow_dispatch:

concurrency:
  group: message-digest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.122.1

      - name: Find the project ref and service-role key
        id: keys
        run: |
          set -euo pipefail
          PROJECTS=$(supabase projects list -o json)
          REF=$(echo "$PROJECTS" | jq -r ".[] | select(.name==\"secondary-tarbiyyah2's Project\") | .id" | head -n1)
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            COUNT=$(echo "$PROJECTS" | jq 'length')
            if [ "$COUNT" = "1" ]; then REF=$(echo "$PROJECTS" | jq -r '.[0].id'); fi
          fi
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            echo "::error::Could not find the Supabase project."
            exit 1
          fi
          SERVICE_ROLE=$(supabase projects api-keys --project-ref "$REF" -o json | jq -r '.[] | select(.name=="service_role" or .name=="secret") | .api_key' | head -n1)
          if [ -z "$SERVICE_ROLE" ] || [ "$SERVICE_ROLE" = "null" ]; then
            echo "::error::Could not find a service_role/secret key."
            exit 1
          fi
          echo "::add-mask::$SERVICE_ROLE"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "service_role_key=$SERVICE_ROLE" >> "$GITHUB_OUTPUT"

      - name: Call message-email (daily digest)
        run: |
          set -euo pipefail
          curl -sS -X POST "https://${{ steps.keys.outputs.ref }}.supabase.co/functions/v1/message-email" \
            -H "apikey: ${{ steps.keys.outputs.service_role_key }}" \
            -H "Authorization: Bearer ${{ steps.keys.outputs.service_role_key }}" \
            -H "Content-Type: application/json" \
            -d '{"kind":"digest"}'
