name: Capture portal screenshots

# Takes real phone and desktop screenshots of the family dashboard (signed in
# as the demo parent) for the homepage's parent portal section, and commits
# them to public/images/portal-preview/. Runs by itself after every site
# deploy, so the homepage always shows the portal as it is now; when the
# screenshots change it commits them and redeploys the site once (that
# redeploy's commit is the screenshot commit, so it doesn't loop).

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy site"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  capture:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       !startsWith(github.event.workflow_run.head_commit.message, 'Update portal screenshots'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.122.1
      - name: Find the project and keys
        id: keys
        run: |
          set -euo pipefail
          REF=$(supabase projects list -o json | jq -r '.[0].id')
          KEYS=$(supabase projects api-keys --project-ref "$REF" -o json)
          SR=$(echo "$KEYS" | jq -r '.[] | select(.name=="service_role" or .name=="secret") | .api_key' | head -n1)
          AN=$(echo "$KEYS" | jq -r '.[] | select(.name=="anon" or .name=="publishable") | .api_key' | head -n1)
          echo "::add-mask::$SR"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "sr=$SR" >> "$GITHUB_OUTPUT"
          echo "anon=$AN" >> "$GITHUB_OUTPUT"
      - run: npm ci --no-audit --no-fund
      - run: npm i --no-save --no-audit --no-fund playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Capture
        env:
          SUPABASE_URL: https://${{ steps.keys.outputs.ref }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.keys.outputs.sr }}
          SUPABASE_ANON_KEY: ${{ steps.keys.outputs.anon }}
          LEARN_URL: ${{ vars.LEARN_SITE_URL || 'https://learn.tarbiyyah.co.uk' }}
        run: |
          export PREVIEW_KEY="$(tr -d '[:space:]' < deploy/preview-key.txt)"
          node scripts/capture-portal-screenshots.mjs
          sudo apt-get install -y -qq pngquant >/dev/null
          pngquant --force --skip-if-larger --quality 75-95 --ext .png public/images/portal-preview/*.png || true
          ls -la public/images/portal-preview
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/portal-preview
          git diff --cached --quiet && exit 0
          git commit -m "Update portal screenshots"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
          # A push made with GITHUB_TOKEN doesn't start other workflows, so ask for the redeploy.
          gh workflow run "Deploy site" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
