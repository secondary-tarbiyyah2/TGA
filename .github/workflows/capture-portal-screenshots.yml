name: Capture portal screenshots

# Takes real phone and desktop screenshots of the family dashboard (signed in
# as the demo parent) for the homepage's parent portal section, and commits
# them to public/portal/. Re-run whenever the dashboard changes.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/capture-portal-screenshots.yml, scripts/capture-portal-screenshots.mjs]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Find the project and keys
        id: keys
        run: |
          set -euo pipefail
          REF=$(supabase projects list -o json | jq -r '.[0].id')
          KEYS=$(supabase projects api-keys --project-ref "$REF" -o json)
          SR=$(echo "$KEYS" | jq -r '.[] | select(.name=="service_role" or .name=="secret") | .api_key' | head -n1)
          AN=$(echo "$KEYS" | jq -r '.[] | select(.name=="anon" or .name=="publishable") | .api_key' | head -n1)
          echo "::add-mask::$SR"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "sr=$SR" >> "$GITHUB_OUTPUT"
          echo "anon=$AN" >> "$GITHUB_OUTPUT"
      - run: npm ci --no-audit --no-fund
      - run: npm i --no-save --no-audit --no-fund playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Capture
        env:
          SUPABASE_URL: https://${{ steps.keys.outputs.ref }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.keys.outputs.sr }}
          SUPABASE_ANON_KEY: ${{ steps.keys.outputs.anon }}
          LEARN_URL: ${{ vars.LEARN_SITE_URL || 'https://learn.tarbiyyah.co.uk' }}
        run: |
          export PREVIEW_KEY="$(tr -d '[:space:]' < deploy/preview-key.txt)"
          node scripts/capture-portal-screenshots.mjs
          sudo apt-get install -y -qq pngquant >/dev/null
          pngquant --force --skip-if-larger --quality 75-95 --ext .png public/portal/*.png || true
          ls -la public/portal
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/portal
          git diff --cached --quiet && exit 0
          git commit -m "Update portal screenshots"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
