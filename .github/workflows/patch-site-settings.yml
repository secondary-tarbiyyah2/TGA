name: Patch site settings

# Ad-hoc tool for one-off, targeted edits to the live siteSettings singleton
# in Sanity — e.g. fee changes made on request — without re-running the full
# seed (which would overwrite any other fields already edited in Studio).
# See scripts/patch-site-settings.mjs.

on:
  workflow_dispatch:
    inputs:
      fields_json:
        description: 'Fields to set, as JSON, e.g. {"applicationFee":50}'
        required: true

concurrency:
  group: patch-site-settings
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_IO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply patch
        run: |
          node scripts/patch-site-settings.mjs '${{ inputs.fields_json }}' | tee /tmp/patch-output.txt
          {
            echo "## siteSettings patch"
            echo '```'
            cat /tmp/patch-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
