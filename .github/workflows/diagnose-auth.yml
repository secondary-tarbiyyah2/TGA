name: Diagnose auth emails

# Reads the last hour of Supabase Auth logs (errors around password-reset and
# invite emails) and which SMTP route Auth is configured with, as annotations.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-auth.yml]

# Least privilege (security audit T20): this workflow only reads the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Auth config and logs
        env:
          SES_SMTP_USER: ${{ secrets.SES_SMTP_USER }}
          SES_SMTP_PASS: ${{ secrets.SES_SMTP_PASS }}
          AWS_SES_REGION: ${{ secrets.AWS_SES_REGION }}
        run: |
          set -uo pipefail
          A="Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
          REF=$(curl -sS https://api.supabase.com/v1/projects -H "$A" | jq -r '.[0].id')
          echo "::notice title=SES secrets::SES_SMTP_USER=${SES_SMTP_USER:+set} SES_SMTP_PASS=${SES_SMTP_PASS:+set} AWS_SES_REGION=${AWS_SES_REGION:+set}"
          CFG=$(curl -sS "https://api.supabase.com/v1/projects/$REF/config/auth" -H "$A")
          echo "::notice title=Auth SMTP::$(echo "$CFG" | jq -c '{smtp_host, smtp_port, smtp_user, smtp_admin_email, smtp_sender_name, mailer_otp_exp, mailer_otp_length, rate_limit_email_sent}')"
          echo "::notice title=Recovery template head::$(echo "$CFG" | jq -r '.mailer_templates_recovery_content // ""' | tr '\n' ' ' | cut -c1-600)"
          SQL="select timestamp, event_message from auth_logs where timestamp > timestamp_sub(current_timestamp(), interval 4 hour) and (regexp_contains(event_message, '(?i)error|smtp|mail|recover|500')) order by timestamp desc limit 15"
          R=$(curl -sS -G "https://api.supabase.com/v1/projects/$REF/analytics/endpoints/logs.all" -H "$A" --data-urlencode "sql=$SQL")
          echo "$R" | jq -r '.result[]? | .event_message' | while read -r L; do
            M=$(echo "$L" | jq -r '[.msg, .error, .path, .status, .component] | map(select(. != null)) | join(" | ")' 2>/dev/null || echo "$L")
            echo "::warning title=auth log::$(echo "${M:-$L}" | cut -c1-900)"
          done
          echo "::notice title=log query::$(echo "$R" | jq -c '{error, n: (.result|length)}' | cut -c1-400)"
