name: Open evening reminders

# Hourly: emails everyone booked on an open evening (open_evening_bookings,
# 0087) a reminder in the 24 hours before it starts. All the logic, and the
# "never remind the same booking twice" guarantee (reminder_sent_at), live in
# the open-evening-reminders Edge Function; this only calls it. The function
# is deployed with --no-verify-jwt and checks for the service-role key as the
# Bearer token, same as noshow-alerts.yml.

on:
  schedule:
    # Reduced from hourly in Oct 2026 to stay inside GitHub's 2,000 free
    # Actions minutes a month (private repo; every run bills at least 1 min).
    # Before live lessons start, move this schedule to Supabase pg_cron
    # (free, no GitHub minutes) and restore the faster interval there.
    - cron: "17 */6 * * *" # every 6 hours (reminders go out in the 24h before)
  workflow_dispatch:

concurrency:
  group: open-evening-reminders
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Find the project ref and service-role key
        id: keys
        run: |
          set -euo pipefail
          PROJECTS=$(supabase projects list -o json)
          REF=$(echo "$PROJECTS" | jq -r ".[] | select(.name==\"secondary-tarbiyyah2's Project\") | .id" | head -n1)
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            COUNT=$(echo "$PROJECTS" | jq 'length')
            if [ "$COUNT" = "1" ]; then REF=$(echo "$PROJECTS" | jq -r '.[0].id'); fi
          fi
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            echo "::error::Could not find the Supabase project."
            exit 1
          fi
          SERVICE_ROLE=$(supabase projects api-keys --project-ref "$REF" -o json | jq -r '.[] | select(.name=="service_role" or .name=="secret") | .api_key' | head -n1)
          if [ -z "$SERVICE_ROLE" ] || [ "$SERVICE_ROLE" = "null" ]; then
            echo "::error::Could not find a service_role/secret key."
            exit 1
          fi
          echo "::add-mask::$SERVICE_ROLE"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "service_role_key=$SERVICE_ROLE" >> "$GITHUB_OUTPUT"

      - name: Call open-evening-reminders
        run: |
          set -euo pipefail
          curl -sS --fail-with-body -X POST "https://${{ steps.keys.outputs.ref }}.supabase.co/functions/v1/open-evening-reminders" \
            -H "apikey: ${{ steps.keys.outputs.service_role_key }}" \
            -H "Authorization: Bearer ${{ steps.keys.outputs.service_role_key }}" \
            -H "Content-Type: application/json"
