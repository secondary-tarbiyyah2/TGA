name: Set up Sanity auto-rebuild webhook

# One-time (idempotent) setup — see scripts/setup-sanity-webhook.mjs for
# what this does and why. Requires two repo secrets that must be added by
# hand first (see SETUP.md): SANITY_MANAGEMENT_TOKEN and GH_DISPATCH_TOKEN.

on:
  workflow_dispatch:

# Least privilege (security audit T20): this workflow only reads the repo.
permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
      SANITY_MANAGEMENT_TOKEN: ${{ secrets.SANITY_MANAGEMENT_TOKEN }}
      GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/setup-sanity-webhook.mjs
