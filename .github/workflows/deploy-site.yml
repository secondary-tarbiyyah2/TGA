name: Deploy site

# Builds the static export (output: "export" in next.config.ts — plain
# HTML/CSS/JS, no Node server needed), splits it in two
# (scripts/split-static-export.mjs — see its header comment for why), and
# uploads each half over FTP to its own document root: the marketing site to
# https://globalacademy.tarbiyyah.co.uk/ and the authenticated /learn portal
# to its own subdomain, https://learn.tarbiyyah.co.uk/ — kept
# on a separate origin so an XSS bug on the public site can never read the
# portal's session/localStorage (see public/.htaccess and SETUP.md, "Moving
# /learn to its own subdomain"). This is why the site can live on a 2GB
# shared host alongside WordPress: there's nothing running, just files.
#
# Requires three repo secrets for the main site (Settings > Secrets and
# variables > Actions):
#   FTP_HOST      — e.g. ftp.tarbiyyah.co.uk
#   FTP_USERNAME  — the FTP account's login, e.g. tga-deploy@globalacademy.tarbiyyah.co.uk
#   FTP_PASSWORD  — that FTP account's password
#
# ...and two more for the /learn subdomain, using its OWN separate FTP
# account rather than FTP_USERNAME/FTP_PASSWORD above:
#   FTP_LEARN_USERNAME / FTP_LEARN_PASSWORD — a SEPARATE FTP account scoped
#     directly to the learn.tarbiyyah.co.uk document root (public_html/learn).
#     A second account is required, not just a different server-dir on the
#     main account, because FTP_USERNAME is itself scoped ("chrooted") to
#     the main site's own document root — confirmed live: uploading to
#     "public_html/learn/" under that account silently created a nested
#     phantom folder INSIDE the main site's docroot
#     (public_html/globalacademy.tarbiyyah.co.uk/public_html/learn/,
#     reachable proof at the time: https://globalacademy.tarbiyyah.co.uk/
#     public_html/learn/index.html returned our /learn build's HTML) rather
#     than ever reaching the real, sibling public_html/learn folder — a
#     chroot can't be escaped by any relative path. No default — the deploy
#     step below is skipped entirely until FTP_LEARN_USERNAME is set, so the
#     main-site deploy keeps working on its own in the meantime.
#
# Optional repo variable:
#   FTP_REMOTE_DIR — where in the FTP account to upload the MAIN site to. If
#     the FTP account's own home directory was set to the site's document
#     root when it was created, leave this unset (defaults to "./").
#     Otherwise set it to the doc root's path relative to the FTP account's
#     home, e.g. "public_html/globalacademy/".
#   LEARN_SITE_URL — the /learn subdomain's public origin, e.g.
#     "https://learn.tarbiyyah.co.uk". Defaults to that same
#     value if unset. This is the ONE place that URL is configured for CI —
#     it's baked into the frontend build (NEXT_PUBLIC_LEARN_ORIGIN, see
#     src/lib/learn/origin.ts) and also feeds deploy-supabase.yml's Auth
#     config and Edge Function secrets, so every marketing-site link into
#     the portal and every server-generated invite/reset link point at the
#     same origin.
#
# Also fetches the Supabase URL/anon key directly from the Supabase API at
# build time (using the same SUPABASE_ACCESS_TOKEN secret as the backend
# deploy workflow) and bakes them into the build via NEXT_PUBLIC_* env vars
# — the anon key is safe to publish (see DESIGN.md) but this avoids ever
# needing to copy/paste it by hand.

on:
  push:
    branches: [claude/sweet-albattani-e7fav5, main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - ".github/workflows/deploy-site.yml"
      - "deploy/preview-key.txt"
  workflow_dispatch:
  # sanity-content-published: fired by a Sanity webhook (see
  # scripts/setup-sanity-webhook.mjs) -- kept for the LMS's own
  # terms/academic-year and signable-document syncs, which are still
  # Sanity-sourced (see 0025_website_content.sql's header for why those
  # two weren't migrated alongside the rest of the marketing content).
  # website-content-published: fired by the publish-website-content Edge
  # Function right after an admin saves a change in /learn/admin/content
  # (marketing content's new home, see 0025_website_content.sql) -- this is
  # what makes an edit there actually go live: the site is a static
  # export, so the database write alone changes nothing until a rebuild
  # runs.
  repository_dispatch:
    types: [sanity-content-published, website-content-published]

# Deploys to the same live FTP server regardless of which branch triggered
# it — a global (branch-independent) group, not one keyed by github.ref, so
# a push to main right after one to the feature branch queues instead of
# racing it. Found the hard way: two runs at the same commit on different
# branches both touched the FTP-Deploy-Action's remote sync-state file at
# once, and one got "FTPError: 550 ... No such file or directory" from a
# file the other had already moved.
concurrency:
  group: deploy-site
  cancel-in-progress: false

# Least privilege (security audit T20): this workflow only reads the repo.
permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Mirrored into env because the `secrets` context isn't available in
      # step `if:` conditions at all (confirmed by a real dispatch attempt:
      # "Unrecognized named-value: 'secrets'") — only in env/with. The `env`
      # context IS available in step `if:`, so the "is this secret set"
      # check below reads this instead of secrets.FTP_LEARN_USERNAME
      # directly.
      FTP_LEARN_USERNAME: ${{ secrets.FTP_LEARN_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: latest

      - name: Find the Supabase project ref
        id: project
        run: |
          set -euo pipefail
          PROJECTS=$(supabase projects list -o json)
          REF=$(echo "$PROJECTS" | jq -r ".[] | select(.name==\"secondary-tarbiyyah2's Project\") | .id" | head -n1)
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            COUNT=$(echo "$PROJECTS" | jq 'length')
            if [ "$COUNT" = "1" ]; then
              REF=$(echo "$PROJECTS" | jq -r '.[0].id')
            fi
          fi
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            echo "::error::Could not find the Supabase project. Projects found: $(echo "$PROJECTS" | jq -c '[.[].name]')"
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Fetch the Supabase anon key
        id: keys
        run: |
          set -euo pipefail
          KEYS=$(supabase projects api-keys --project-ref "${{ steps.project.outputs.ref }}" -o json)
          ANON=$(echo "$KEYS" | jq -r '.[] | select(.name=="anon" or .name=="publishable") | .api_key' | head -n1)
          if [ -z "$ANON" ] || [ "$ANON" = "null" ]; then
            echo "::error::Could not find an anon/publishable key. Key names found: $(echo "$KEYS" | jq -c '[.[].name]')"
            exit 1
          fi
          echo "anon_key=$ANON" >> "$GITHUB_OUTPUT"

      - name: Build static export
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://${{ steps.project.outputs.ref }}.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.keys.outputs.anon_key }}
          NEXT_PUBLIC_ADMISSIONS_TEAMS_URL: ${{ vars.ADMISSIONS_TEAMS_URL || 'https://teams.microsoft.com/l/meetup-join/19%3ameeting_M2UwM2U2NzYtNjhkMS00ZDRkLTlmODctNTZiMWZmMWFiMzcw%40thread.v2/0?context=%7b%22Tid%22%3a%22a0b25b15-bb34-4892-a564-6c8277ae3db2%22%2c%22Oid%22%3a%223b6d0aa6-0912-44cc-b592-f83506cd0d80%22%7d' }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
          NEXT_PUBLIC_LEARN_ORIGIN: ${{ vars.LEARN_SITE_URL || 'https://learn.tarbiyyah.co.uk' }}
        run: npm run build

      # Policy PDFs from the text edited in the portal (policy_links.body_md,
      # migration 0174). The bundled PDFs in public/policies/ are the fallback
      # for any policy that has no text in the database; a row that does have
      # text overwrites its PDF here, so "Edit text" in the portal is what the
      # public downloads. marked and playwright are installed ad hoc so the
      # site's own dependencies stay small (see scripts/build-policies.cjs).
      - name: Render policy PDFs from the database
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://${{ steps.project.outputs.ref }}.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.keys.outputs.anon_key }}
        run: |
          set -euo pipefail
          npm i --no-save --no-audit --no-fund marked playwright
          npx playwright install --with-deps chromium
          node scripts/build-policies.cjs --from-db --out out/policies

      # Sanity Studio (the admin panel at /studio) is a separate static SPA
      # built from the same schema — only worth building once a project ID
      # exists, otherwise `sanity build` has nothing to point at.
      - name: Build Sanity Studio
        if: vars.NEXT_PUBLIC_SANITY_PROJECT_ID != ''
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
        run: npm run sanity:build

      # Runs explicitly here (NOT as an npm `postbuild` hook on the Next.js
      # build above) specifically because it must happen AFTER Sanity Studio
      # is built into out/studio — a postbuild hook fires the moment `next
      # build` itself finishes, before this later "Build Sanity Studio" step
      # even runs, which would silently ship out-main/ with no /studio at
      # all. Splits the complete out/ (marketing pages + studio) into
      # out-main/, and out/learn/ (promoted to root) into out-learn/ — see
      # scripts/split-static-export.mjs and SETUP.md, "Moving /learn to its
      # own subdomain".
      - name: Split static export for the /learn subdomain
        run: npm run split-static-export

      # Pre-launch staff preview (see src/lib/prelaunch.ts): write the private
      # preview key into the main site's and the portal's .htaccess. The PREVIEW_KEY secret wins
      # if set; otherwise deploy/preview-key.txt (this repo is private). With
      # neither, a random throwaway key keeps the gate closed to everyone.
      - name: Set the staff preview key
        env:
          PREVIEW_KEY: ${{ secrets.PREVIEW_KEY }}
        run: |
          key="$PREVIEW_KEY"
          if [ -z "$key" ] && [ -f deploy/preview-key.txt ]; then key="$(tr -d '[:space:]' < deploy/preview-key.txt)"; fi
          if [ -z "$key" ]; then key="$(openssl rand -hex 24)"; echo "::warning::PREVIEW_KEY secret not set; staff preview disabled for this deploy."; fi
          case "$key" in *[!A-Za-z0-9]*) echo "::error::PREVIEW_KEY must be letters and digits only"; exit 1;; esac
          sed -i "s/__PREVIEW_KEY__/$key/g" out-main/.htaccess out-learn/.htaccess
          if grep -q "__PREVIEW_KEY__" out-main/.htaccess out-learn/.htaccess; then echo "::error::preview key placeholder left in .htaccess"; exit 1; fi

      - name: Deploy main site to FTP
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./out-main/
          server-dir: ${{ vars.FTP_REMOTE_DIR || './' }}
          # Never delete files on the server that aren't in this build —
          # protects anything placed there outside of this pipeline (e.g.
          # register.config.php, which isn't committed to git — see README).
          dangerous-clean-slate: false

      # The old hand-built static site left top-level pages on the server
      # (faq.html, offer.html, …) that this build never overwrites or removes,
      # and they still described Reception, A Levels and a January start.
      # .htaccess already 301s them, but delete the files too. Only these
      # exact names are touched (never index.html, PHP or config files), and
      # a missing file is not an error, so this is safe to run every deploy.
      - name: Delete the old static site's pages from the server
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_REMOTE_DIR || './' }}
        run: |
          sudo apt-get install -y -qq lftp >/dev/null
          cmds="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; cd \"$FTP_DIR\";"
          for f in admissions.html faq.html offer.html register.html trust.html why.html; do
            cmds="$cmds rm -f $f;"
          done
          cmds="$cmds cls -1 *.html; bye"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "$FTP_HOST" -e "$cmds" || echo "Old-page clean-up could not finish; the .htaccess redirects still cover them."

      # Skipped until FTP_LEARN_USERNAME is set — see this workflow's top
      # comment. Uses its OWN FTP account (scoped directly to
      # public_html/learn, server-dir "./") rather than FTP_USERNAME/
      # FTP_PASSWORD — that account is chrooted to the main site's own
      # docroot and cannot reach the /learn subdomain's folder at all, no
      # matter what server-dir is given (confirmed live — see top comment).
      - name: Deploy /learn portal to FTP (subdomain)
        if: env.FTP_LEARN_USERNAME != ''
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_LEARN_USERNAME }}
          password: ${{ secrets.FTP_LEARN_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./out-learn/
          server-dir: ./
          # Same reasoning as the main site's step above — never wipe
          # anything placed there outside this pipeline.
          dangerous-clean-slate: false
