name: Check policy review dates

# Weekly check that no statutory policy's review date has quietly gone
# stale. See scripts/check-policy-reviews.mjs for what "notify" means here
# (best-effort email + always a summary in the run itself).

on:
  schedule:
    - cron: "0 8 * * 1" # Mondays, 08:00 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_IO }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      AWS_SES_REGION: ${{ secrets.AWS_SES_REGION }}
      AWS_SES_ACCESS_KEY_ID: ${{ secrets.AWS_SES_ACCESS_KEY_ID }}
      AWS_SES_SECRET_ACCESS_KEY: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-policy-reviews.mjs
