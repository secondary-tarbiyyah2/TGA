name: Diagnose FTP account scope and /learn upload path

# One-off diagnostic for a live 404 on learn.tarbiyyah.co.uk despite a
# successful-looking FTP deploy (313 files uploaded, zero errors) once its
# cPanel document root was set to public_html/learn. FTP-Deploy-Action
# creates whatever server-dir it's given if it doesn't already exist, so a
# "successful" deploy proves nothing about whether that path is actually
# the subdomain's real document root — it could just as easily have created
# a harmless-looking nested folder inside a DIFFERENT, chrooted FTP home
# (see deploy-site.yml's own comment: "If your FTP account is scoped
# narrower than [both doc roots], either widen it or create a second FTP
# account"). This logs into the exact same FTP account used by deploy-site
# with plain ftplib and prints:
#   - the working directory immediately after login (reveals if the account
#     is chrooted to some subdirectory rather than the true account root)
#   - what's actually inside public_html/ and public_html/learn/ from that
#     vantage point
# No files are changed; read-only LIST/PWD commands only.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: FTP directory diagnostic
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_LEARN_REMOTE_DIR: ${{ secrets.FTP_LEARN_REMOTE_DIR }}
          FTP_REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR }}
        run: python3 scripts/diagnose-ftp-paths.py
