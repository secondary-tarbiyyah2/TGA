name: Messaging retention

# Deletes parent-teacher/staff message threads past their configured
# retention period. See scripts/messaging-retention.mjs. Same
# "find the project, fetch the service-role key" steps as
# lms-recording-retention.yml.

on:
  schedule:
    - cron: "30 3 * * *" # once a day, 03:30 UTC — after the recording-retention job
  workflow_dispatch:

concurrency:
  group: messaging-retention
  cancel-in-progress: false

# Least privilege (security audit T20): this workflow only reads the repo.
permissions:
  contents: read

jobs:
  retention:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.122.1

      - name: Find the project ref
        id: project
        run: |
          set -euo pipefail
          PROJECTS=$(supabase projects list -o json)
          REF=$(echo "$PROJECTS" | jq -r ".[] | select(.name==\"secondary-tarbiyyah2's Project\") | .id" | head -n1)
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            COUNT=$(echo "$PROJECTS" | jq 'length')
            if [ "$COUNT" = "1" ]; then
              REF=$(echo "$PROJECTS" | jq -r '.[0].id')
            fi
          fi
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            echo "::error::Could not find the Supabase project. Projects found: $(echo "$PROJECTS" | jq -c '[.[].name]')"
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Fetch service-role key
        id: keys
        run: |
          set -euo pipefail
          KEYS=$(supabase projects api-keys --project-ref "${{ steps.project.outputs.ref }}" -o json)
          SERVICE_ROLE=$(echo "$KEYS" | jq -r '.[] | select(.name=="service_role" or .name=="secret") | .api_key' | head -n1)
          if [ -z "$SERVICE_ROLE" ] || [ "$SERVICE_ROLE" = "null" ]; then
            echo "::error::Could not find a service_role/secret key."
            exit 1
          fi
          echo "::add-mask::$SERVICE_ROLE"
          echo "service_role_key=$SERVICE_ROLE" >> "$GITHUB_OUTPUT"

      - name: Run messaging retention job
        env:
          SUPABASE_URL: https://${{ steps.project.outputs.ref }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.keys.outputs.service_role_key }}
        run: node scripts/messaging-retention.mjs
