name: Deploy Supabase backend

# Runs the Supabase CLI on GitHub's runners (which have normal internet
# access) instead of any developer machine — this is how the booking
# backend gets deployed given that couldn't happen from the Claude Code
# sandbox that built it (org network policy blocks api.supabase.com there).
#
# Requires two repo secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  — Supabase account access token
#   RESEND_API_KEY         — Resend API key, used both to configure Auth SMTP
#                             and as the Edge Functions' own secret for
#                             sending booking emails
#
# Optional, to send through Amazon SES instead (see SETUP.md, "Email via
# Amazon SES"). When set they take priority over Resend, which stays as the
# fallback:
#   AWS_SES_REGION, AWS_SES_ACCESS_KEY_ID, AWS_SES_SECRET_ACCESS_KEY
#                          — Edge Functions send via the SES API
#   SES_SMTP_USER, SES_SMTP_PASS
#                          — Supabase Auth (sign-in/magic-link emails) uses
#                             SES SMTP instead of Resend SMTP
#
# Assumes a Supabase project named "TGA" already exists on the account tied
# to SUPABASE_ACCESS_TOKEN (per the original setup instructions). This
# workflow finds it by name rather than a hardcoded project ref, so no ref
# needs to be stored anywhere.

on:
  push:
    branches: [claude/sweet-albattani-e7fav5, main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:
    inputs:
      owner_email:
        description: "One-time: email to seed as the first staff admin (leave blank to skip)"
        required: false
        default: ""
      head_teacher_email:
        description: "One-time: email to invite as the first /learn Head Teacher (leave blank to skip)"
        required: false
        default: ""
      head_teacher_name:
        description: "Full name for the first /learn Head Teacher (required if head_teacher_email is set)"
        required: false
        default: ""

# Same reasoning as deploy-site.yml: one shared live Supabase project
# regardless of which branch triggered this, so concurrent runs shouldn't
# apply migrations/deploy functions against it at once.
concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # `supabase test db` needs a local stack already running — it doesn't
      # start one itself. `supabase start` spins up ephemeral Postgres +
      # friends via Docker (preinstalled on ubuntu-latest) — no project
      # credentials involved, this is entirely local to the runner.
      - run: supabase start
      - name: Run database tests
        run: |
          set +e
          supabase test db > /tmp/dbtest.txt 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "not ok|Failed|ERROR|expected|got|have:|want:|Parse errors|Result" /tmp/dbtest.txt | head -25 | while IFS= read -r line; do echo "::error::${line:0:400}"; done
          fi
          exit $code
      - if: always()
        run: supabase stop

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Find the project ref
        id: project
        run: |
          set -euo pipefail
          PROJECTS=$(supabase projects list -o json)
          # The project was never renamed off Supabase's auto-generated default
          # ("<account>'s Project"), so match that first; fall back to "there's
          # only one project on this account" so a future rename doesn't quietly
          # break this — either way, never guess among multiple candidates.
          REF=$(echo "$PROJECTS" | jq -r ".[] | select(.name==\"secondary-tarbiyyah2's Project\") | .id" | head -n1)
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            COUNT=$(echo "$PROJECTS" | jq 'length')
            if [ "$COUNT" = "1" ]; then
              REF=$(echo "$PROJECTS" | jq -r '.[0].id')
            fi
          fi
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            echo "::error::Could not find the Supabase project (expected 'secondary-tarbiyyah2's Project', or exactly one project on this account). Projects found: $(echo "$PROJECTS" | jq -c '[.[].name]')"
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Link project
        run: supabase link --project-ref "${{ steps.project.outputs.ref }}"

      - name: Push database migrations
        run: |
          set +e
          # --include-all: migrations written in parallel can land with a lower number
          # than one already applied; apply them anyway rather than fail.
          supabase db push --linked --include-all --yes > /tmp/dbpush.txt 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -v -i "password\|token\|secret" /tmp/dbpush.txt | tail -25 | while IFS= read -r line; do echo "::error::${line:0:400}"; done
          fi
          exit $code

      - name: Fetch project API keys
        id: keys
        run: |
          set -euo pipefail
          KEYS=$(supabase projects api-keys --project-ref "${{ steps.project.outputs.ref }}" -o json)
          # Newer Supabase projects expose "publishable"/"secret" keys instead
          # of (or alongside) the legacy "anon"/"service_role" names — accept
          # either so this doesn't silently emit an empty key.
          ANON=$(echo "$KEYS" | jq -r '.[] | select(.name=="anon" or .name=="publishable") | .api_key' | head -n1)
          SERVICE_ROLE=$(echo "$KEYS" | jq -r '.[] | select(.name=="service_role" or .name=="secret") | .api_key' | head -n1)
          if [ -z "$ANON" ] || [ "$ANON" = "null" ] || [ -z "$SERVICE_ROLE" ] || [ "$SERVICE_ROLE" = "null" ]; then
            echo "::error::Could not find both an anon/publishable key and a service_role/secret key. Key names found: $(echo "$KEYS" | jq -c '[.[].name]')"
            exit 1
          fi
          # Sanity check: these must never be the same value — if they are,
          # something upstream (CLI/API) returned the privileged key where
          # the public one was expected, and publishing it as "safe" would
          # hand out full database access. Fail loudly instead of guessing.
          if [ "$ANON" = "$SERVICE_ROLE" ]; then
            echo "::error::The resolved anon/publishable key is identical to the service_role/secret key — refusing to treat it as public. Key names found: $(echo "$KEYS" | jq -c '[.[].name]')"
            exit 1
          fi
          # Non-reversible fingerprints (safe to print) to help diagnose key
          # selection without ever exposing the actual key material.
          echo "anon key fingerprint:          $(printf '%s' "$ANON" | sha256sum | cut -c1-12)"
          echo "service_role key fingerprint:  $(printf '%s' "$SERVICE_ROLE" | sha256sum | cut -c1-12)"
          # ::add-mask:: is a stdout workflow command, not an output — it must
          # NOT go inside the block redirected to $GITHUB_OUTPUT (that file
          # only accepts key=value lines; a stray "::add-mask::..." line in
          # it is what broke this step both previous runs).
          echo "::add-mask::$SERVICE_ROLE"
          {
            echo "anon_key=$ANON"
            echo "service_role_key=$SERVICE_ROLE"
          } >> "$GITHUB_OUTPUT"

      - name: Set Edge Function secrets
        run: |
          supabase secrets set --yes --project-ref "${{ steps.project.outputs.ref }}" \
            RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
            ADMISSIONS_TEAMS_URL="${{ vars.ADMISSIONS_TEAMS_URL || 'https://teams.microsoft.com/l/meetup-join/19%3ameeting_M2UwM2U2NzYtNjhkMS00ZDRkLTlmODctNTZiMWZmMWFiMzcw%40thread.v2/0?context=%7b%22Tid%22%3a%22a0b25b15-bb34-4892-a564-6c8277ae3db2%22%2c%22Oid%22%3a%223b6d0aa6-0912-44cc-b592-f83506cd0d80%22%7d' }}" \
            SITE_URL="https://globalacademy.tarbiyyah.co.uk" \
            LEARN_SITE_URL="${{ vars.LEARN_SITE_URL || 'https://learn.tarbiyyah.co.uk' }}" \
            ADMISSIONS_EMAIL="globalacademy@tarbiyyah.co.uk" \
            MAIL_FROM_EMAIL="noreply@globalacademy.tarbiyyah.co.uk" \
            MAIL_FROM_NAME="Tarbiyyah Global Academy"

      # Send mail from the school's Microsoft 365 / Outlook mailbox (Microsoft
      # Graph). Only set when all four secrets exist, so nothing is overwritten
      # by blanks. Without them, mail falls back to Resend.
      - name: Set Microsoft 365 mail secrets (if provided)
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_SENDER_EMAIL: ${{ secrets.MS_SENDER_EMAIL }}
        run: |
          if [ -n "$MS_TENANT_ID" ] && [ -n "$MS_CLIENT_ID" ] && [ -n "$MS_CLIENT_SECRET" ] && [ -n "$MS_SENDER_EMAIL" ]; then
            supabase secrets set --yes --project-ref "${{ steps.project.outputs.ref }}" MS_TENANT_ID="$MS_TENANT_ID" MS_CLIENT_ID="$MS_CLIENT_ID" MS_CLIENT_SECRET="$MS_CLIENT_SECRET" MS_SENDER_EMAIL="$MS_SENDER_EMAIL"
          fi

      # Teams meetings / attendance switches (docs/microsoft-365-setup.md).
      # Each is set only when the GitHub secret exists, so values set directly
      # in the Supabase dashboard are never blanked.
      - name: Set Microsoft Teams secrets (if provided)
        env:
          MS_MEETING_ORGANISER: ${{ secrets.MS_MEETING_ORGANISER }}
          MS_TEAMS_ATTENDANCE: ${{ secrets.MS_TEAMS_ATTENDANCE }}
          MS_TEAMS_MEETINGS: ${{ secrets.MS_TEAMS_MEETINGS }}
          MS_TEAMS_INVITE_FAMILIES: ${{ secrets.MS_TEAMS_INVITE_FAMILIES }}
          MS_TENANT_DOMAINS: ${{ secrets.MS_TENANT_DOMAINS }}
        run: |
          ARGS=()
          for NAME in MS_MEETING_ORGANISER MS_TEAMS_ATTENDANCE MS_TEAMS_MEETINGS MS_TEAMS_INVITE_FAMILIES MS_TENANT_DOMAINS; do
            VALUE="${!NAME}"
            if [ -n "$VALUE" ]; then ARGS+=("$NAME=$VALUE"); fi
          done
          if [ ${#ARGS[@]} -gt 0 ]; then
            supabase secrets set --yes --project-ref "${{ steps.project.outputs.ref }}" "${ARGS[@]}"
          fi

      # Amazon SES (see _shared/ses.ts). Only set when all three secrets
      # exist, so blanks never overwrite a working server secret. When set,
      # Edge Functions send via SES and only fall back to Resend on failure.
      - name: Set Amazon SES mail secrets (if provided)
        env:
          AWS_SES_REGION: ${{ secrets.AWS_SES_REGION }}
          AWS_SES_ACCESS_KEY_ID: ${{ secrets.AWS_SES_ACCESS_KEY_ID }}
          AWS_SES_SECRET_ACCESS_KEY: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$AWS_SES_REGION" ] && [ -n "$AWS_SES_ACCESS_KEY_ID" ] && [ -n "$AWS_SES_SECRET_ACCESS_KEY" ]; then
            supabase secrets set --yes --project-ref "${{ steps.project.outputs.ref }}" AWS_SES_REGION="$AWS_SES_REGION" AWS_SES_ACCESS_KEY_ID="$AWS_SES_ACCESS_KEY_ID" AWS_SES_SECRET_ACCESS_KEY="$AWS_SES_SECRET_ACCESS_KEY"
          else
            echo "AWS_SES_* not set in repo secrets; Edge Functions send via Resend."
          fi

      # Video calls (BigBlueButton). Only set when the repo has the secrets,
      # so an empty value never overwrites a server secret set by hand.
      # Until they exist, booking-join falls back to the Teams link.
      - name: Set video-call secrets (if provided)
        env:
          BBB_SERVER_URL: ${{ secrets.BBB_SERVER_URL }}
          BBB_SECRET: ${{ secrets.BBB_SECRET }}
        run: |
          if [ -n "$BBB_SERVER_URL" ] && [ -n "$BBB_SECRET" ]; then
            supabase secrets set --yes --project-ref "${{ steps.project.outputs.ref }}" BBB_SERVER_URL="$BBB_SERVER_URL" BBB_SECRET="$BBB_SECRET"
          else
            echo "BBB_SERVER_URL / BBB_SECRET not set in repo secrets; calls will use the Teams fallback."
          fi

      # Lets publish-website-content trigger a site rebuild after an admin
      # saves a change in /learn/admin/content (0025_website_content.sql) --
      # same GH_DISPATCH_TOKEN used for the old Sanity webhook setup (a
      # fine-grained PAT scoped to only this repo's Actions:write). Until
      # it's added as a repo secret, that function's dispatch call simply
      # no-ops (see its own code) rather than failing the save.
      - name: Set website-content publish secrets (if provided)
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          if [ -n "$GH_DISPATCH_TOKEN" ]; then
            supabase secrets set --yes --project-ref "${{ steps.project.outputs.ref }}" GH_DISPATCH_TOKEN="$GH_DISPATCH_TOKEN" GH_DISPATCH_REPO="${{ github.repository }}"
          else
            echo "GH_DISPATCH_TOKEN not set in repo secrets; website-content saves won't auto-trigger a rebuild yet."
          fi

      # Claude (Anthropic) API, shared by every function that uses
      # _shared/claude.ts (inbound-absence's second reader, ai-assist, ...),
      # plus the absence-by-email settings (docs/absence-email-setup.md).
      # This is the ONE place ANTHROPIC_API_KEY is wired: add new AI settings
      # here rather than a second step. Each value is set only when the
      # GitHub secret/variable exists, so values set in the Supabase
      # dashboard are never blanked:
      #   ANTHROPIC_API_KEY (secret)     Claude API key; AI features stay off without it
      #   AI_MODEL (variable)            default model, else claude-haiku-5-5
      #   AI_DAILY_LIMIT (variable)      ai-assist calls per UK day, default 500
      #   RESEND_INBOUND_WEBHOOK_SECRET  signing secret (whsec_...) of the Resend
      #     (secret)                     "email.received" webhook; without it
      #                                  inbound-absence rejects every webhook
      #   ABSENCE_PARSER_MODEL (var)     optional model just for absence emails
      #   ABSENCE_INBOX_EMAIL (var)      optional; default absence@globalacademy.tarbiyyah.co.uk
      - name: Set Claude AI and absence-email secrets (if provided)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_DAILY_LIMIT: ${{ vars.AI_DAILY_LIMIT }}
          RESEND_INBOUND_WEBHOOK_SECRET: ${{ secrets.RESEND_INBOUND_WEBHOOK_SECRET }}
          ABSENCE_PARSER_MODEL: ${{ vars.ABSENCE_PARSER_MODEL }}
          ABSENCE_INBOX_EMAIL: ${{ vars.ABSENCE_INBOX_EMAIL }}
          # Test senders: absence emails from these addresses are read as if sent by the
          # demo parent (demo-parent@tarbiyyah.co.uk), so the owner can try it safely.
          ABSENCE_TEST_SENDERS: ${{ vars.ABSENCE_TEST_SENDERS || 'itzamadou8007@gmail.com' }}
        run: |
          ARGS=()
          for NAME in ANTHROPIC_API_KEY AI_MODEL AI_DAILY_LIMIT RESEND_INBOUND_WEBHOOK_SECRET ABSENCE_PARSER_MODEL ABSENCE_INBOX_EMAIL ABSENCE_TEST_SENDERS; do
            VALUE="${!NAME}"
            if [ -n "$VALUE" ]; then ARGS+=("$NAME=$VALUE"); fi
          done
          if [ ${#ARGS[@]} -gt 0 ]; then
            supabase secrets set --yes --project-ref "${{ steps.project.outputs.ref }}" "${ARGS[@]}"
          else
            echo "No Claude / absence-email secrets in the repo yet; AI features are off and inbound-absence rejects webhooks until RESEND_INBOUND_WEBHOOK_SECRET is set."
          fi

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy book-admissions-call --yes --project-ref "${{ steps.project.outputs.ref }}" --no-verify-jwt
          supabase functions deploy manage-booking --yes --project-ref "${{ steps.project.outputs.ref }}" --no-verify-jwt
          supabase functions deploy send-reminders --yes --project-ref "${{ steps.project.outputs.ref }}" --no-verify-jwt
          # No --no-verify-jwt here on purpose: this one requires a valid
          # signed-in caller before its own code even runs (it separately
          # checks that caller is specifically an admin — see the function).
          supabase functions deploy admin-manage-staff --yes --project-ref "${{ steps.project.outputs.ref }}"
          # learn-login must be reachable with no session at all (it's what
          # decides whether a sign-in attempt is even allowed to proceed).
          supabase functions deploy learn-login --yes --project-ref "${{ steps.project.outputs.ref }}" --no-verify-jwt
          # learn-invite: verified, like admin-manage-staff — it separately
          # re-checks the caller holds Head Teacher/Admin under their own
          # RLS before doing anything (see the function).
          supabase functions deploy learn-invite --yes --project-ref "${{ steps.project.outputs.ref }}"
          # timetable-ics must be reachable with no session at all (a
          # calendar app polling a URL) — security is the token, not login.
          supabase functions deploy timetable-ics --yes --project-ref "${{ steps.project.outputs.ref }}" --no-verify-jwt
          # timetable-move/-publish/-cover: verified — each separately
          # re-checks the caller's own permission server-side (see each
          # function's own comments).
          supabase functions deploy timetable-move --yes --project-ref "${{ steps.project.outputs.ref }}"
          supabase functions deploy timetable-publish --yes --project-ref "${{ steps.project.outputs.ref }}"
          supabase functions deploy timetable-cover --yes --project-ref "${{ steps.project.outputs.ref }}"
          # These were written but never added here, so they didn't exist on
          # the server: "Start call", lesson joins, recordings, lesson set-up,
          # timetable generation, the quiz plan email and flagged-message
          # alerts all failed. Verified ones re-check the caller's role in
          # their own code; the two --no-verify-jwt ones are called with no
          # session (anonymous quiz-takers, a scheduled job).
          supabase functions deploy admissions-correspond --yes --project-ref "${{ steps.project.outputs.ref }}"
          supabase functions deploy admissions-payment-proof --yes --project-ref "${{ steps.project.outputs.ref }}" --no-verify-jwt
          # Automatic accounts on acceptance, student username logins and the
          # instant "application received" email. The first two are verified
          # (each re-checks the caller's role); admissions-submitted has no
          # session (the public form) and only emails the address already on
          # the fresh application.
          supabase functions deploy admissions-create-accounts --yes --project-ref "${{ steps.project.outputs.ref }}"
          supabase functions deploy student-account --yes --project-ref "${{ steps.project.outputs.ref }}"
          supabase functions deploy admissions-submitted --yes --project-ref "${{ steps.project.outputs.ref }}" --no-verify-jwt
          supabase functions deploy document-sign-request --yes --project-ref "${{ steps.project.outputs.ref }}"
          supabase functions deploy document-signed-copy --yes --project-ref "${{ steps.project.outputs.ref }}"
          supabase functions deploy document-signed-pdf --yes --project-ref "${{ steps.project.outputs.ref }}"
          supabase functions deploy booking-join --yes --project-ref "${{ steps.project.outputs.ref }}"
          supabase functions deploy lesson-join --yes --project-ref "${{ steps.project.outputs.ref }}"
          supabase functions deploy lesson-instances-generate --yes --project-ref "${{ steps.project.outputs.ref }}"
          supabase functions deploy lesson-update-details --yes --project-ref "${{ steps.project.outputs.ref }}"
          # Verified: re-checks the caller is the booking's parent/teacher or
          # Head Teacher/Admin before emailing (see the function).
          supabase functions deploy parent-evening-confirm --yes --project-ref "${{ steps.project.outputs.ref }}"
          supabase functions deploy recording-access --yes --project-ref "${{ steps.project.outputs.ref }}"
          supabase functions deploy recording-control --yes --project-ref "${{ steps.project.outputs.ref }}"
          supabase functions deploy trigger-timetable-generation --yes --project-ref "${{ steps.project.outputs.ref }}"
          supabase functions deploy quiz-send-plan --yes --project-ref "${{ steps.project.outputs.ref }}" --no-verify-jwt
          supabase functions deploy notify-flagged-messages --yes --project-ref "${{ steps.project.outputs.ref }}" --no-verify-jwt
          # Scheduled (safeguarding-review-check.yml): idempotent sweep and
          # lead alert; the purge only deletes expired export files.
          supabase functions deploy safeguarding-review-check --yes --project-ref "${{ steps.project.outputs.ref }}" --no-verify-jwt
          supabase functions deploy purge-data-exports --yes --project-ref "${{ steps.project.outputs.ref }}" --no-verify-jwt
          # subject-access-export: verified; re-checks Headteacher/Admin with
          # the caller's own token, then uses the service role to assemble data.
          supabase functions deploy subject-access-export --yes --project-ref "${{ steps.project.outputs.ref }}"
          # noshow-alerts is scheduled (no session) so it skips JWT verification,
          # but the function itself requires the service-role key as the Bearer
          # token. cover-notify is verified and re-checks the caller's role.
          supabase functions deploy noshow-alerts --yes --project-ref "${{ steps.project.outputs.ref }}" --no-verify-jwt
          supabase functions deploy cover-notify --yes --project-ref "${{ steps.project.outputs.ref }}"
          # Verified -- separately re-checks the caller is an admin (see the
          # function); a session-less caller would be rejected before that
          # check even runs.
          supabase functions deploy publish-website-content --yes --project-ref "${{ steps.project.outputs.ref }}"
          # curriculum-sync: verified; teachers, Headteacher and admins only
          # (re-checked in the function). Starts "Sync curriculum from the
          # portal" after a curriculum or lesson edit is saved.
          supabase functions deploy curriculum-sync --yes --project-ref "${{ steps.project.outputs.ref }}"
          # weekly-digest: no gateway JWT check because the Friday cron
          # (weekly-digest.yml) is not a user. The function authorises
          # itself: service-role key for the scheduled run, or a signed-in
          # Headteacher/Admin for the preview/test tools.
          supabase functions deploy weekly-digest --yes --project-ref "${{ steps.project.outputs.ref }}" --no-verify-jwt
          # star-certificate: verified; staff only (re-checked in the function).
          supabase functions deploy star-certificate --yes --project-ref "${{ steps.project.outputs.ref }}"
          # absence-escalate: verified; head/admin only (re-checked in the function).
          supabase functions deploy absence-escalate --yes --project-ref "${{ steps.project.outputs.ref }}"
          # policy-file: public website policies streamed to deploy/policy.php
          # (the main site's /policies/<slug>.pdf); open-evening-book: the
          # public booking form (honeypot + rate limit inside); open-evening-
          # reminders: hourly scheduled job, requires the service-role key.
          supabase functions deploy policy-file --yes --project-ref "${{ steps.project.outputs.ref }}" --no-verify-jwt
          supabase functions deploy open-evening-book --yes --project-ref "${{ steps.project.outputs.ref }}" --no-verify-jwt
          # careers-apply: the public job application form (honeypot, minimum
          # fill-in time, rate limit and file checks inside).
          supabase functions deploy careers-apply --yes --project-ref "${{ steps.project.outputs.ref }}" --no-verify-jwt
          supabase functions deploy entry-assessment --yes --project-ref "${{ steps.project.outputs.ref }}" --no-verify-jwt
          supabase functions deploy open-evening-reminders --yes --project-ref "${{ steps.project.outputs.ref }}" --no-verify-jwt
          # teams-sync: Microsoft Teams meetings + attendance for lessons. No
          # gateway JWT check because the cron (teams-sync.yml) is not a user;
          # the function accepts the service-role key or a signed-in
          # Headteacher/Admin (School settings → Microsoft 365 connection).
          supabase functions deploy teams-sync --yes --project-ref "${{ steps.project.outputs.ref }}" --no-verify-jwt
          # inbound-absence: Resend Inbound webhook for absence@ emails. No
          # gateway JWT check because Resend is not a user; the function
          # verifies the Svix signature (RESEND_INBOUND_WEBHOOK_SECRET) and
          # re-checks Headteacher/Admin for the staff confirm/dismiss actions.
          supabase functions deploy inbound-absence --yes --project-ref "${{ steps.project.outputs.ref }}" --no-verify-jwt
          # ai-assist: verified; staff-only AI drafts (report comments, Weekly
          # Tarbiyah Notes, parent-message triage). Re-checks the caller's role
          # with their own token; never sends anything to families itself.
          supabase functions deploy ai-assist --yes --project-ref "${{ steps.project.outputs.ref }}"

      # Sign-in emails: Amazon SES SMTP when SES_SMTP_USER/SES_SMTP_PASS (and
      # AWS_SES_REGION) are set, otherwise Resend SMTP. Built with jq so a
      # password containing + / = or quotes can't break the JSON.
      # The password-reset email carries a 6-digit code as well as the link,
      # so it can be read on another device (see src/app/learn/login/forgot).
      # Security emails: every password set/change and email change is
      # notified to the account holder (Supabase security notifications).
      - name: Configure Auth (magic link via SES or Resend SMTP)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AWS_SES_REGION: ${{ secrets.AWS_SES_REGION }}
          SES_SMTP_USER: ${{ secrets.SES_SMTP_USER }}
          SES_SMTP_PASS: ${{ secrets.SES_SMTP_PASS }}
          LEARN_SITE_URL: ${{ vars.LEARN_SITE_URL || 'https://learn.tarbiyyah.co.uk' }}
        run: |
          set -euo pipefail
          # Resend first: the domain is verified there (27 Oct 2026). SES is only
          # a fallback when no Resend key is set.
          if [ -n "$RESEND_API_KEY" ]; then
            SMTP_HOST="smtp.resend.com"; SMTP_USER="resend"; SMTP_PASS="$RESEND_API_KEY"
            echo "Auth emails: Resend SMTP"
          elif [ -n "$SES_SMTP_USER" ] && [ -n "$SES_SMTP_PASS" ] && [ -n "$AWS_SES_REGION" ]; then
            SMTP_HOST="email-smtp.${AWS_SES_REGION}.amazonaws.com"; SMTP_USER="$SES_SMTP_USER"; SMTP_PASS="$SES_SMTP_PASS"
            echo "Auth emails: Amazon SES SMTP ($SMTP_HOST)"
          else
            echo "::error::No SMTP credentials (RESEND_API_KEY or SES_SMTP_*)"; exit 1
          fi
          jq -n \
            --arg host "$SMTP_HOST" --arg user "$SMTP_USER" --arg pass "$SMTP_PASS" --arg learn "$LEARN_SITE_URL" \
            '{
              site_url: "https://globalacademy.tarbiyyah.co.uk",
              uri_allow_list: ("https://globalacademy.tarbiyyah.co.uk/**," + $learn + "/**,http://localhost:3000/**"),
              external_email_enabled: true,
              mailer_autoconfirm: false,
              smtp_admin_email: "noreply@globalacademy.tarbiyyah.co.uk",
              smtp_host: $host,
              smtp_port: "465",
              smtp_user: $user,
              smtp_pass: $pass,
              smtp_sender_name: "Tarbiyyah Global Academy",
              rate_limit_email_sent: 100,
              mailer_otp_exp: 86400,
              mailer_otp_length: 6,
              mailer_subjects_recovery: "Your password reset code",
              mailer_notifications_password_changed_enabled: true,
              mailer_subjects_password_changed_notification: "Your password was changed",
              mailer_templates_password_changed_notification_content: ("<div style=\"font-family:Arial,Helvetica,sans-serif;color:#1b1e21;max-width:520px;margin:0 auto;padding:24px\"><p style=\"font-size:16px\">Assalamu alaikum,</p><p style=\"font-size:16px\">The password for your Tarbiyyah Global Academy account ({{ .Email }}) has just been set or changed.</p><p style=\"font-size:16px\">If this was you, for example because you have just set up your account or reset your password, there is nothing else to do.</p><p style=\"font-size:16px\"><strong>If it was not you</strong>, reset your password straight away at <a href=\"" + $learn + "/login/forgot\">" + $learn + "/login/forgot</a> and contact the school office at globalacademy@tarbiyyah.co.uk.</p><p style=\"font-size:14px;color:#6b7178\">Tarbiyyah Global Academy</p></div>"),
              mailer_notifications_email_changed_enabled: true,
              mailer_subjects_email_changed_notification: "Your account email was changed",
              mailer_templates_email_changed_notification_content: ("<div style=\"font-family:Arial,Helvetica,sans-serif;color:#1b1e21;max-width:520px;margin:0 auto;padding:24px\"><p style=\"font-size:16px\">Assalamu alaikum,</p><p style=\"font-size:16px\">The email address for your Tarbiyyah Global Academy account has been changed from {{ .OldEmail }} to {{ .Email }}.</p><p style=\"font-size:16px\"><strong>If you did not make this change</strong>, contact the school office straight away at globalacademy@tarbiyyah.co.uk.</p><p style=\"font-size:14px;color:#6b7178\">Tarbiyyah Global Academy</p></div>"),
              mailer_templates_recovery_content: ("<div style=\"font-family:Arial,Helvetica,sans-serif;color:#1b1e21;max-width:520px;margin:0 auto;padding:24px\"><p style=\"font-size:16px\">Assalamu alaikum,</p><p style=\"font-size:16px\">Here is your code to reset your Tarbiyyah Global Academy password: <strong>{{ .Token }}</strong></p><p style=\"font-size:32px;font-weight:bold;letter-spacing:8px;text-align:center;background:#f5ecd6;border-radius:12px;padding:16px;margin:16px 0\">{{ .Token }}</p><p style=\"font-size:16px\">Type it on the reset page, or tap the button if you are on the device you asked from:</p><p style=\"text-align:center;margin:16px 0 24px\"><a href=\"" + $learn + "/login/invite?token_hash={{ .TokenHash }}&type=recovery\" style=\"background:#7d6428;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:8px;font-weight:bold;display:inline-block\">Reset my password</a></p><p style=\"font-size:14px;color:#6b7178\">Code {{ .Token }} and this link work once and expire after 24 hours. If you did not ask for this, you can ignore this email: your password will not change.</p><p style=\"font-size:14px;color:#6b7178\">Tarbiyyah Global Academy</p></div>")
            }' > /tmp/auth-config.json
          curl -sS -X PATCH "https://api.supabase.com/v1/projects/${{ steps.project.outputs.ref }}/config/auth" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @/tmp/auth-config.json \
            --fail-with-body
          rm -f /tmp/auth-config.json

      - name: Report public config (add these to the site's env)
        run: |
          # Also echo to the job log (not just the step summary) — the anon
          # key is meant to be public (see DESIGN.md), so this is safe, and
          # it makes the values retrievable via the Actions API/logs too.
          echo "NEXT_PUBLIC_SUPABASE_URL=https://${{ steps.project.outputs.ref }}.supabase.co"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ steps.keys.outputs.anon_key }}"
          echo "## Add these to the site's build environment" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "NEXT_PUBLIC_SUPABASE_URL=https://${{ steps.project.outputs.ref }}.supabase.co" >> "$GITHUB_STEP_SUMMARY"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ steps.keys.outputs.anon_key }}" >> "$GITHUB_STEP_SUMMARY"
          echo "NEXT_PUBLIC_ADMISSIONS_TEAMS_URL=<same value as the ADMISSIONS_TEAMS_URL repo variable>" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "The anon key is safe to publish — it's meant to be public (see DESIGN.md)." >> "$GITHUB_STEP_SUMMARY"

      - name: Seed first admin (only if owner_email was provided)
        if: github.event_name == 'workflow_dispatch' && inputs.owner_email != ''
        env:
          SUPABASE_URL: https://${{ steps.project.outputs.ref }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.keys.outputs.service_role_key }}
        run: |
          set -euo pipefail
          # Does NOT depend on email delivery — creates the account directly
          # with a temporary password via the service-role admin API (see
          # scripts/seed-admin.mjs), since Resend can't send yet and GoTrue's
          # invite API fails outright when email delivery is broken.
          npm ci
          node scripts/seed-admin.mjs "${{ inputs.owner_email }}" | tee /tmp/seed-admin-output.txt

          {
            echo "## First admin seeded"
            echo '```'
            cat /tmp/seed-admin-output.txt
            echo '```'
            echo "⚠️ The temporary password above is shown only in this log — copy it now. It will not be shown again."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Invite first /learn Head Teacher (only if head_teacher_email was provided)
        if: github.event_name == 'workflow_dispatch' && inputs.head_teacher_email != ''
        env:
          SUPABASE_URL: https://${{ steps.project.outputs.ref }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.keys.outputs.service_role_key }}
          LEARN_SITE_URL: ${{ vars.LEARN_SITE_URL || 'https://learn.tarbiyyah.co.uk' }}
        run: |
          set -euo pipefail
          npm ci
          node scripts/invite-first-head-teacher.mjs "${{ inputs.head_teacher_email }}" "${{ inputs.head_teacher_name }}" | tee /tmp/invite-ht-output.txt

          {
            echo "## First /learn Head Teacher invited"
            echo '```'
            cat /tmp/invite-ht-output.txt
            echo '```'
            echo "⚠️ The setup link above is shown only in this log — copy it now. It will not be shown again."
          } >> "$GITHUB_STEP_SUMMARY"
