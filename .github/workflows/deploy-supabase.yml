name: Deploy Supabase backend

# Runs the Supabase CLI on GitHub's runners (which have normal internet
# access) instead of any developer machine — this is how the booking
# backend gets deployed given that couldn't happen from the Claude Code
# sandbox that built it (org network policy blocks api.supabase.com there).
#
# Requires two repo secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  — Supabase account access token
#   RESEND_API_KEY         — Resend API key, used both to configure Auth SMTP
#                             and as the Edge Functions' own secret for
#                             sending booking emails
#
# Assumes a Supabase project named "TGA" already exists on the account tied
# to SUPABASE_ACCESS_TOKEN (per the original setup instructions). This
# workflow finds it by name rather than a hardcoded project ref, so no ref
# needs to be stored anywhere.

on:
  push:
    branches: [claude/sweet-albattani-e7fav5, main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:
    inputs:
      owner_email:
        description: "One-time: email to seed as the first staff admin (leave blank to skip)"
        required: false
        default: ""
      head_teacher_email:
        description: "One-time: email to invite as the first /learn Head Teacher (leave blank to skip)"
        required: false
        default: ""
      head_teacher_name:
        description: "Full name for the first /learn Head Teacher (required if head_teacher_email is set)"
        required: false
        default: ""

# Same reasoning as deploy-site.yml: one shared live Supabase project
# regardless of which branch triggered this, so concurrent runs shouldn't
# apply migrations/deploy functions against it at once.
concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # `supabase test db` needs a local stack already running — it doesn't
      # start one itself. `supabase start` spins up ephemeral Postgres +
      # friends via Docker (preinstalled on ubuntu-latest) — no project
      # credentials involved, this is entirely local to the runner.
      - run: supabase start
      - run: supabase test db
      - if: always()
        run: supabase stop

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Find the project ref
        id: project
        run: |
          set -euo pipefail
          PROJECTS=$(supabase projects list -o json)
          # The project was never renamed off Supabase's auto-generated default
          # ("<account>'s Project"), so match that first; fall back to "there's
          # only one project on this account" so a future rename doesn't quietly
          # break this — either way, never guess among multiple candidates.
          REF=$(echo "$PROJECTS" | jq -r ".[] | select(.name==\"secondary-tarbiyyah2's Project\") | .id" | head -n1)
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            COUNT=$(echo "$PROJECTS" | jq 'length')
            if [ "$COUNT" = "1" ]; then
              REF=$(echo "$PROJECTS" | jq -r '.[0].id')
            fi
          fi
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            echo "::error::Could not find the Supabase project (expected 'secondary-tarbiyyah2's Project', or exactly one project on this account). Projects found: $(echo "$PROJECTS" | jq -c '[.[].name]')"
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Link project
        run: supabase link --project-ref "${{ steps.project.outputs.ref }}"

      - name: Push database migrations
        run: supabase db push --linked

      - name: Fetch project API keys
        id: keys
        run: |
          set -euo pipefail
          KEYS=$(supabase projects api-keys --project-ref "${{ steps.project.outputs.ref }}" -o json)
          # Newer Supabase projects expose "publishable"/"secret" keys instead
          # of (or alongside) the legacy "anon"/"service_role" names — accept
          # either so this doesn't silently emit an empty key.
          ANON=$(echo "$KEYS" | jq -r '.[] | select(.name=="anon" or .name=="publishable") | .api_key' | head -n1)
          SERVICE_ROLE=$(echo "$KEYS" | jq -r '.[] | select(.name=="service_role" or .name=="secret") | .api_key' | head -n1)
          if [ -z "$ANON" ] || [ "$ANON" = "null" ] || [ -z "$SERVICE_ROLE" ] || [ "$SERVICE_ROLE" = "null" ]; then
            echo "::error::Could not find both an anon/publishable key and a service_role/secret key. Key names found: $(echo "$KEYS" | jq -c '[.[].name]')"
            exit 1
          fi
          # Sanity check: these must never be the same value — if they are,
          # something upstream (CLI/API) returned the privileged key where
          # the public one was expected, and publishing it as "safe" would
          # hand out full database access. Fail loudly instead of guessing.
          if [ "$ANON" = "$SERVICE_ROLE" ]; then
            echo "::error::The resolved anon/publishable key is identical to the service_role/secret key — refusing to treat it as public. Key names found: $(echo "$KEYS" | jq -c '[.[].name]')"
            exit 1
          fi
          # Non-reversible fingerprints (safe to print) to help diagnose key
          # selection without ever exposing the actual key material.
          echo "anon key fingerprint:          $(printf '%s' "$ANON" | sha256sum | cut -c1-12)"
          echo "service_role key fingerprint:  $(printf '%s' "$SERVICE_ROLE" | sha256sum | cut -c1-12)"
          # ::add-mask:: is a stdout workflow command, not an output — it must
          # NOT go inside the block redirected to $GITHUB_OUTPUT (that file
          # only accepts key=value lines; a stray "::add-mask::..." line in
          # it is what broke this step both previous runs).
          echo "::add-mask::$SERVICE_ROLE"
          {
            echo "anon_key=$ANON"
            echo "service_role_key=$SERVICE_ROLE"
          } >> "$GITHUB_OUTPUT"

      - name: Set Edge Function secrets
        run: |
          supabase secrets set --project-ref "${{ steps.project.outputs.ref }}" \
            RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
            ADMISSIONS_TEAMS_URL="${{ vars.ADMISSIONS_TEAMS_URL || 'https://teams.microsoft.com/l/meetup-join/19%3ameeting_M2UwM2U2NzYtNjhkMS00ZDRkLTlmODctNTZiMWZmMWFiMzcw%40thread.v2/0?context=%7b%22Tid%22%3a%22a0b25b15-bb34-4892-a564-6c8277ae3db2%22%2c%22Oid%22%3a%223b6d0aa6-0912-44cc-b592-f83506cd0d80%22%7d' }}" \
            SITE_URL="https://globalacademy.tarbiyyah.co.uk" \
            LEARN_SITE_URL="${{ vars.LEARN_SITE_URL || 'https://learn.tarbiyyah.co.uk' }}" \
            ADMISSIONS_EMAIL="globalacademy@tarbiyyah.co.uk" \
            MAIL_FROM_EMAIL="noreply@globalacademy.tarbiyyah.co.uk" \
            MAIL_FROM_NAME="Tarbiyyah Global Academy"

      # Video calls (BigBlueButton). Only set when the repo has the secrets,
      # so an empty value never overwrites a server secret set by hand.
      # Until they exist, booking-join falls back to the Teams link.
      - name: Set video-call secrets (if provided)
        env:
          BBB_SERVER_URL: ${{ secrets.BBB_SERVER_URL }}
          BBB_SECRET: ${{ secrets.BBB_SECRET }}
        run: |
          if [ -n "$BBB_SERVER_URL" ] && [ -n "$BBB_SECRET" ]; then
            supabase secrets set --project-ref "${{ steps.project.outputs.ref }}" BBB_SERVER_URL="$BBB_SERVER_URL" BBB_SECRET="$BBB_SECRET"
          else
            echo "BBB_SERVER_URL / BBB_SECRET not set in repo secrets; calls will use the Teams fallback."
          fi

      # Lets publish-website-content trigger a site rebuild after an admin
      # saves a change in /learn/admin/content (0025_website_content.sql) --
      # same GH_DISPATCH_TOKEN used for the old Sanity webhook setup (a
      # fine-grained PAT scoped to only this repo's Actions:write). Until
      # it's added as a repo secret, that function's dispatch call simply
      # no-ops (see its own code) rather than failing the save.
      - name: Set website-content publish secrets (if provided)
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          if [ -n "$GH_DISPATCH_TOKEN" ]; then
            supabase secrets set --project-ref "${{ steps.project.outputs.ref }}" GH_DISPATCH_TOKEN="$GH_DISPATCH_TOKEN" GH_DISPATCH_REPO="${{ github.repository }}"
          else
            echo "GH_DISPATCH_TOKEN not set in repo secrets; website-content saves won't auto-trigger a rebuild yet."
          fi

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy book-admissions-call --project-ref "${{ steps.project.outputs.ref }}" --no-verify-jwt
          supabase functions deploy manage-booking --project-ref "${{ steps.project.outputs.ref }}" --no-verify-jwt
          supabase functions deploy send-reminders --project-ref "${{ steps.project.outputs.ref }}" --no-verify-jwt
          # No --no-verify-jwt here on purpose: this one requires a valid
          # signed-in caller before its own code even runs (it separately
          # checks that caller is specifically an admin — see the function).
          supabase functions deploy admin-manage-staff --project-ref "${{ steps.project.outputs.ref }}"
          # learn-login must be reachable with no session at all (it's what
          # decides whether a sign-in attempt is even allowed to proceed).
          supabase functions deploy learn-login --project-ref "${{ steps.project.outputs.ref }}" --no-verify-jwt
          # learn-invite: verified, like admin-manage-staff — it separately
          # re-checks the caller holds Head Teacher/Admin under their own
          # RLS before doing anything (see the function).
          supabase functions deploy learn-invite --project-ref "${{ steps.project.outputs.ref }}"
          # timetable-ics must be reachable with no session at all (a
          # calendar app polling a URL) — security is the token, not login.
          supabase functions deploy timetable-ics --project-ref "${{ steps.project.outputs.ref }}" --no-verify-jwt
          # timetable-move/-publish/-cover: verified — each separately
          # re-checks the caller's own permission server-side (see each
          # function's own comments).
          supabase functions deploy timetable-move --project-ref "${{ steps.project.outputs.ref }}"
          supabase functions deploy timetable-publish --project-ref "${{ steps.project.outputs.ref }}"
          supabase functions deploy timetable-cover --project-ref "${{ steps.project.outputs.ref }}"
          # These were written but never added here, so they didn't exist on
          # the server: "Start call", lesson joins, recordings, lesson set-up,
          # timetable generation, the quiz plan email and flagged-message
          # alerts all failed. Verified ones re-check the caller's role in
          # their own code; the two --no-verify-jwt ones are called with no
          # session (anonymous quiz-takers, a scheduled job).
          supabase functions deploy admissions-correspond --project-ref "${{ steps.project.outputs.ref }}"
          supabase functions deploy document-sign-request --project-ref "${{ steps.project.outputs.ref }}"
          supabase functions deploy document-signed-copy --project-ref "${{ steps.project.outputs.ref }}"
          supabase functions deploy booking-join --project-ref "${{ steps.project.outputs.ref }}"
          supabase functions deploy lesson-join --project-ref "${{ steps.project.outputs.ref }}"
          supabase functions deploy lesson-instances-generate --project-ref "${{ steps.project.outputs.ref }}"
          supabase functions deploy lesson-update-details --project-ref "${{ steps.project.outputs.ref }}"
          supabase functions deploy recording-access --project-ref "${{ steps.project.outputs.ref }}"
          supabase functions deploy recording-control --project-ref "${{ steps.project.outputs.ref }}"
          supabase functions deploy trigger-timetable-generation --project-ref "${{ steps.project.outputs.ref }}"
          supabase functions deploy quiz-send-plan --project-ref "${{ steps.project.outputs.ref }}" --no-verify-jwt
          supabase functions deploy notify-flagged-messages --project-ref "${{ steps.project.outputs.ref }}" --no-verify-jwt
          # Verified -- separately re-checks the caller is an admin (see the
          # function); a session-less caller would be rejected before that
          # check even runs.
          supabase functions deploy publish-website-content --project-ref "${{ steps.project.outputs.ref }}"

      - name: Configure Auth (magic link via Resend SMTP)
        run: |
          set -euo pipefail
          curl -sS -X PATCH "https://api.supabase.com/v1/projects/${{ steps.project.outputs.ref }}/config/auth" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
              "site_url": "https://globalacademy.tarbiyyah.co.uk",
              "uri_allow_list": "https://globalacademy.tarbiyyah.co.uk/**,${{ vars.LEARN_SITE_URL || 'https://learn.tarbiyyah.co.uk' }}/**,http://localhost:3000/**",
              "external_email_enabled": true,
              "mailer_autoconfirm": false,
              "smtp_admin_email": "noreply@globalacademy.tarbiyyah.co.uk",
              "smtp_host": "smtp.resend.com",
              "smtp_port": "465",
              "smtp_user": "resend",
              "smtp_pass": "${{ secrets.RESEND_API_KEY }}",
              "smtp_sender_name": "Tarbiyyah Global Academy"
            }' \
            --fail-with-body

      - name: Report public config (add these to the site's env)
        run: |
          # Also echo to the job log (not just the step summary) — the anon
          # key is meant to be public (see DESIGN.md), so this is safe, and
          # it makes the values retrievable via the Actions API/logs too.
          echo "NEXT_PUBLIC_SUPABASE_URL=https://${{ steps.project.outputs.ref }}.supabase.co"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ steps.keys.outputs.anon_key }}"
          echo "## Add these to the site's build environment" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "NEXT_PUBLIC_SUPABASE_URL=https://${{ steps.project.outputs.ref }}.supabase.co" >> "$GITHUB_STEP_SUMMARY"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ steps.keys.outputs.anon_key }}" >> "$GITHUB_STEP_SUMMARY"
          echo "NEXT_PUBLIC_ADMISSIONS_TEAMS_URL=<same value as the ADMISSIONS_TEAMS_URL repo variable>" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "The anon key is safe to publish — it's meant to be public (see DESIGN.md)." >> "$GITHUB_STEP_SUMMARY"

      - name: Seed first admin (only if owner_email was provided)
        if: github.event_name == 'workflow_dispatch' && inputs.owner_email != ''
        env:
          SUPABASE_URL: https://${{ steps.project.outputs.ref }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.keys.outputs.service_role_key }}
        run: |
          set -euo pipefail
          # Does NOT depend on email delivery — creates the account directly
          # with a temporary password via the service-role admin API (see
          # scripts/seed-admin.mjs), since Resend can't send yet and GoTrue's
          # invite API fails outright when email delivery is broken.
          npm ci
          node scripts/seed-admin.mjs "${{ inputs.owner_email }}" | tee /tmp/seed-admin-output.txt

          {
            echo "## First admin seeded"
            echo '```'
            cat /tmp/seed-admin-output.txt
            echo '```'
            echo "⚠️ The temporary password above is shown only in this log — copy it now. It will not be shown again."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Invite first /learn Head Teacher (only if head_teacher_email was provided)
        if: github.event_name == 'workflow_dispatch' && inputs.head_teacher_email != ''
        env:
          SUPABASE_URL: https://${{ steps.project.outputs.ref }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.keys.outputs.service_role_key }}
          LEARN_SITE_URL: ${{ vars.LEARN_SITE_URL || 'https://learn.tarbiyyah.co.uk' }}
        run: |
          set -euo pipefail
          npm ci
          node scripts/invite-first-head-teacher.mjs "${{ inputs.head_teacher_email }}" "${{ inputs.head_teacher_name }}" | tee /tmp/invite-ht-output.txt

          {
            echo "## First /learn Head Teacher invited"
            echo '```'
            cat /tmp/invite-ht-output.txt
            echo '```'
            echo "⚠️ The setup link above is shown only in this log — copy it now. It will not be shown again."
          } >> "$GITHUB_STEP_SUMMARY"
