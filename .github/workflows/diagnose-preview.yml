name: Diagnose staff preview

# Checks the pre-launch gate on the live site from outside: what the public
# gets, what the preview link returns, and what a browser holding the preview
# cookie gets. Results are written as annotations on the run.
on:
  push:
    branches: [main]
    paths: [".github/workflows/diagnose-preview.yml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe the live site
        run: |
          KEY="$(tr -d '[:space:]' < deploy/preview-key.txt)"
          U="https://globalacademy.tarbiyyah.co.uk"
          h() { curl -sS -o /tmp/body -D - "$@" 2>&1 | tr -d '\r' | grep -iE '^(HTTP/|location|set-cookie|cf-cache-status|cache-control|x-robots-tag):' | sed "s/$KEY/<key>/g" | tr '\n' '|'; echo "TITLE $(grep -o '<title>[^<]*' /tmp/body | head -1 | sed 's/<title>//')"; }
          rm -f /tmp/jar; curl -sS -o /dev/null -c /tmp/jar "$U/?preview=$KEY"
          {
            echo "A preview link: $(h "$U/?preview=$KEY")"
            echo "B / with jar: $(h -b /tmp/jar "$U/")"
            echo "C /about/ with jar: $(h -b /tmp/jar "$U/about/")"
            echo "D /fees/ with cookie: $(h -H "Cookie: tga_preview=$KEY" "$U/fees/")"
            echo "E /admissions/apply/ with cookie: $(h -H "Cookie: tga_preview=$KEY" "$U/admissions/apply/")"
            rm -f /tmp/j2
            echo "F browser flow (follow redirects, keep cookies): $(curl -sS -L -c /tmp/j2 -b /tmp/j2 -o /tmp/body -w 'final=%{url_effective} status=%{http_code}' "http://globalacademy.tarbiyyah.co.uk/about/?preview=$KEY" | sed "s/$KEY/<key>/g") TITLE $(grep -o '<title>[^<]*' /tmp/body | head -1 | sed 's/<title>//')"
            echo "G public /about/ (follow): $(curl -sS -L -o /tmp/body -w 'final=%{url_effective}' "$U/about/") TITLE $(grep -o '<title>[^<]*' /tmp/body | head -1 | sed 's/<title>//')"
          } > /tmp/out
          cat /tmp/out
          echo "::warning title=preview probe::$(tr '\n' '#' < /tmp/out | cut -c1-3000)"
