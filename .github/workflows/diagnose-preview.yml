name: Diagnose staff preview

# Checks the pre-launch gate on the live site from outside: what the public
# gets, what the preview link returns, and what a browser holding the preview
# cookie gets. Results are written as annotations on the run.
on:
  push:
    branches: [main]
    paths: [".github/workflows/diagnose-preview.yml"]
  workflow_dispatch:

# Least privilege (security audit T20): this workflow only reads the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Probe the live site
        run: |
          KEY="$(tr -d '[:space:]' < deploy/preview-key.txt)"
          U="https://globalacademy.tarbiyyah.co.uk"
          h() { curl -sS --max-time 20 -o /tmp/body -D - "$@" 2>&1 | tr -d '\r' | grep -iE '^(HTTP/|location|set-cookie|cf-cache-status|cache-control|x-robots-tag):' | sed "s/$KEY/<key>/g" | tr '\n' '|'; echo "TITLE $(grep -o '<title>[^<]*' /tmp/body | head -1 | sed 's/<title>//')"; }
          rm -f /tmp/jar; curl -sS -o /dev/null -c /tmp/jar "$U/?preview=$KEY"
          {
            for n in send.globalacademy rsend.globalacademy; do echo "DNS $n CNAME: $(dig +short CNAME $n.tarbiyyah.co.uk @1.1.1.1) | A: $(dig +short A $n.tarbiyyah.co.uk @1.1.1.1 | head -2 | tr '\n' ' ')"; done
            echo "DNS TXT resend._domainkey.globalacademy: $(dig +short TXT resend._domainkey.globalacademy.tarbiyyah.co.uk @1.1.1.1 | cut -c1-60)"
            echo "DNS TXT (other spellings): $(dig +short TXT resend._domainkey.globalacademy.tarbiyyah.co.uk.tarbiyyah.co.uk @1.1.1.1 | cut -c1-40) / $(dig +short CNAME resend._domainkey.globalacademy.tarbiyyah.co.uk @1.1.1.1)"
          } > /tmp/out
          cat /tmp/out
          echo "::warning title=preview probe::$(tr '\n' '#' < /tmp/out | cut -c1-3000)"
