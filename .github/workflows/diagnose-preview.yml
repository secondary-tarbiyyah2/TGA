name: Diagnose staff preview

# Checks the pre-launch gate on the live site from outside: what the public
# gets, what the preview link returns, and what a browser holding the preview
# cookie gets. Results are written as annotations on the run.
on:
  push:
    branches: [main]
    paths: [".github/workflows/diagnose-preview.yml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe the live site
        run: |
          KEY="$(tr -d '[:space:]' < deploy/preview-key.txt)"
          U="https://globalacademy.tarbiyyah.co.uk"
          note() { echo "::notice title=$1::$(echo "$2" | tr -d '\r' | tr '\n' '|' | tr -s ' ' | cut -c1-900)"; }
          h() { curl -sS -o /tmp/body -D - "$@" 2>&1 | grep -iE '^(HTTP/|location|set-cookie|server|cf-cache-status|cache-control|vary|x-robots-tag|age):' ; echo "TITLE: $(grep -o '<title>[^<]*' /tmp/body | head -1)"; }
          note "1 public /" "$(h "$U/")"
          note "2 public /about/" "$(h "$U/about/")"
          note "3 preview link" "$(h "$U/?preview=$KEY")"
          rm -f /tmp/jar; curl -sS -o /dev/null -c /tmp/jar "$U/?preview=$KEY"
          note "4 cookie jar" "$(sed 's/^#HttpOnly_//' /tmp/jar | grep -v '^#' | awk '{print $1, $4, $6, $7}')"
          note "5 / with jar" "$(h -b /tmp/jar "$U/")"
          note "6 /about/ with jar" "$(h -b /tmp/jar "$U/about/")"
          note "7 /about/ with manual cookie" "$(h -H "Cookie: tga_preview=$KEY" "$U/about/")"
          note "8 robots" "$(curl -sS "$U/robots.txt" | tr '\n' ' ' | cut -c1-400)"
