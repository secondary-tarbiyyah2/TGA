<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No connection, TGA Portal</title>
<meta name="theme-color" content="#1B1E21">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F7F4EC; color: #1B1E21; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  main { max-width: 26rem; margin: 1.5rem; padding: 2rem; background: #fff; border: 1px solid #E8DDC0; border-radius: 1.25rem; text-align: center; }
  img { width: 72px; height: 72px; }
  h1 { font-size: 1.35rem; margin: 1rem 0 .5rem; }
  p { color: #4a4f55; margin: 0 0 1.25rem; }
  button { font: inherit; font-weight: 600; background: #7d6428; color: #fff; border: 0; border-radius: .75rem; padding: .75rem 1.5rem; cursor: pointer; }
  @media (prefers-color-scheme: dark) { body { background: #15171a; color: #f3efe4; } main { background: #1f2225; border-color: #3a352a; } p { color: #b9b4a8; } }
</style>
</head>
<body>
<main>
  <img src="/app-icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>The portal needs an internet connection for lessons, homework and messages. Check your Wi-Fi or data, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
